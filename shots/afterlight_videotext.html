<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>WYGWYL · Afterlight Videotext (14 Poems · 14 Picture Techniques)</title>
<meta name="description" content="Fourteen poems about what light and memory leave behind. A videotext after Sosuke: each poem with its text on the film’s own clock, and each poem in its own Afterlight picture technique.">
<style>
@font-face{font-family:"IM Fell English";src:url(fonts/im-fell-english-latin-400-normal.woff2) format("woff2");font-style:normal;font-display:swap}
@font-face{font-family:"IM Fell English";src:url(fonts/im-fell-english-latin-400-italic.woff2) format("woff2");font-style:italic;font-display:swap}
@font-face{font-family:"IBM Plex Mono";src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format("woff2");font-weight:400 500;font-display:swap}

:root{
  --paper:#ebe3cf;
  --panel:#e2d8c1;
  --ink:#1c1814;
  --soft:#6f6656;
  --faint:#b9af99;
  --lamp:#b86b11;
  --bar:52px;
  --fi:17px;
}
*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;background:var(--paper);color:var(--ink);font:19px/1.6 "IM Fell English",Georgia,serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.sc{text-transform:uppercase;font-size:.8em;letter-spacing:.16em}
.mono{font:500 11px/1.4 "IBM Plex Mono",ui-monospace,Menlo,monospace;letter-spacing:.08em}
@media (max-width:640px){:root{--fi:9px;--bar:46px}body{font-size:18px}}

/* Double-ruled archival frame, as on every Afterlight title card */
.frame{position:fixed;inset:0;pointer-events:none;z-index:60}
.frame i{position:absolute;display:block;border:1px solid var(--ink)}
.frame i.o{inset:calc(var(--fi) - 7px);z-index:2}
.frame i.n{inset:var(--fi);border-width:2px;box-shadow:0 0 0 60px var(--paper)}
@media (max-width:640px){.frame i.o{inset:4px}.frame i.n{border-width:1.5px}}
.unfold .frame i{animation:draw 1.4s cubic-bezier(.6,0,.2,1) both}
.unfold .frame i.n{animation-delay:.15s}
@keyframes draw{from{clip-path:inset(50% 50% 50% 50%)}to{clip-path:inset(-90px -90px -90px -90px)}}

/* ---------- the title page ---------- */
.splash{min-height:92svh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:60px 28px;position:relative}
.splash .eyebrow{color:var(--lamp);margin-bottom:12px}
.splash h1{font-weight:400;font-size:clamp(42px,8.5vw,108px);line-height:1;margin:0;letter-spacing:.015em}
.splash h1 span{display:inline-block}
.unfold .splash h1 span{animation:ink .9s ease-out both;animation-delay:calc(.4s + var(--i) * .05s)}
@keyframes ink{from{opacity:0;color:var(--faint);transform:translateY(.06em)}to{opacity:1;color:var(--ink);transform:none}}
.splash .it{font-style:italic;font-size:clamp(20px,2.5vw,30px);margin:20px 0 6px;max-width:34em}
.splash .by{font-style:italic;font-size:17.5px;color:var(--soft);margin:0;max-width:40em}
.splash .studio-links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:24px}
.splash .studio-links a{
  font:500 11px/1 "IBM Plex Mono",monospace;
  letter-spacing:.08em;
  text-transform:uppercase;
  text-decoration:none;
  padding:8px 14px;
  border:1px solid var(--ink);
  background:var(--panel);
}
.splash .studio-links a:hover{background:var(--ink);color:var(--paper)}
.cue{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--soft);text-decoration:none}
.cue b{width:1px;height:34px;background:var(--ink);position:relative;animation:drop 2.4s ease-in-out infinite}
.cue b::after{content:"";position:absolute;left:-4px;bottom:0;width:7px;height:7px;border-right:1px solid var(--ink);border-bottom:1px solid var(--ink);transform:rotate(45deg)}
@keyframes drop{0%,100%{transform:translateY(0)}50%{transform:translateY(6px)}}

.toc{max-width:920px;margin:0 auto;padding:30px 28px 40px}
.toc h2{font-weight:400;text-align:center;font-size:15px;letter-spacing:.24em;margin:0 0 18px}
.gh{text-align:center;margin:36px 0 22px}
.gh .sc{color:var(--lamp)}
.gh h3{font-weight:400;font-size:clamp(24px,3.6vw,34px);margin:8px 0 6px;letter-spacing:.02em}
.gh p{font-style:italic;font-size:16.5px;color:var(--soft);margin:0 auto;max-width:38em;line-height:1.45}

.row{
  display:grid;
  grid-template-columns:3.2em 120px 1fr auto;
  gap:4px 16px;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid rgba(28,24,20,0.12);
  text-decoration:none;
}
.row .rn{font-size:15px;color:var(--soft);text-align:right;font-variant-numeric:tabular-nums}
.row .th{width:120px;aspect-ratio:16/9;border:1px solid var(--ink);object-fit:cover;display:block;background:#161820}
.row .nm{display:flex;align-items:baseline;gap:10px;min-width:0}
.row .nm b{font-weight:400;font-size:21px}
.row .nm .dist-pill{font:500 10px/1 "IBM Plex Mono",monospace;letter-spacing:.08em;color:var(--soft);text-transform:uppercase}
.row .nm i{flex:1;border-bottom:1px dotted var(--soft);transform:translateY(-5px);min-width:20px}
.row .tm{font:500 12px "IBM Plex Mono",monospace;min-width:3.4em;text-align:right}
.row .sub{grid-column:3/5;font:500 11px/1.45 "IBM Plex Mono",monospace;letter-spacing:.05em;color:var(--soft);margin-top:2px;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.row .fx-tag{background:var(--ink);color:var(--paper);padding:2px 6px;font:500 10px/1.2 "IBM Plex Mono",monospace;letter-spacing:.07em}
.row .swatches{display:inline-flex;gap:2px;vertical-align:middle}
.row .swatches s{width:11px;height:11px;display:inline-block;border:1px solid rgba(28,24,20,0.45)}
.row .idea-line{grid-column:3/5;font-style:italic;font-size:16px;color:var(--ink);margin-top:2px}
a.row:hover .nm b{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
a.row:hover .th{outline:2px solid var(--ink)}
@media (max-width:680px){
  .row{grid-template-columns:2.2em 78px 1fr auto;gap:2px 10px}
  .row .th{width:78px}
  .row .nm b{font-size:17px}
  .row .nm i{display:none}
}

.colophon{max-width:620px;margin:50px auto 0;text-align:center;font-style:italic;font-size:17px;color:var(--soft);padding:0 24px 100px}
.colophon .mono{display:block;font-style:normal;margin-top:18px;line-height:1.9}

/* ---------- the chapter bar ---------- */
.bar{position:fixed;left:calc(var(--fi) + 2px);right:calc(var(--fi) + 2px);top:calc(var(--fi) + 2px);height:var(--bar);z-index:55;background:var(--paper);display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--ink)}
.bar .left-nav{display:flex;align-items:center;gap:14px}
.bar .here{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:16px}
.bar .here span{color:var(--soft);margin-right:.6em}
.bar .pr{position:absolute;left:0;bottom:-1px;height:2px;background:var(--ink);width:0}
.bar .nav{display:flex;gap:8px;align-items:center}
.chev{width:32px;height:32px;display:grid;place-items:center;text-decoration:none}
.chev::before{content:"";width:9px;height:9px;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink)}
.chev.l::before{transform:translateX(2px) rotate(45deg)}
.chev.r::before{transform:translateX(-2px) rotate(-135deg)}
.chev[disabled]{opacity:.25;pointer-events:none}
.modes{display:flex;gap:12px;margin-right:6px}
.modes button{color:var(--soft);border-bottom:1.5px solid transparent;padding:2px 0}
.modes button[aria-pressed=true]{color:var(--ink);border-bottom-color:var(--ink)}

/* ---------- the chapter ---------- */
.chapter{padding-top:calc(var(--bar) + var(--fi) + 10px)}
.chead{text-align:center;margin:0 auto;padding:38px 28px 32px;max-width:920px}
.chead .rn{font-size:14px;letter-spacing:.22em;color:var(--lamp)}
.chead h1{font-weight:400;font-size:clamp(30px,5.2vw,60px);line-height:1.05;margin:8px 0 10px;letter-spacing:.01em}
.chead .it{font-style:italic;font-size:20px;margin:0 0 10px;color:var(--soft)}
.chead .fx-banner{
  display:inline-flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:10px;
  background:var(--panel);
  border:1px solid var(--ink);
  padding:6px 14px;
  font:500 11px/1.3 "IBM Plex Mono",monospace;
  letter-spacing:.06em;
}

.book{max-width:1300px;margin:0 auto;padding:0 40px;display:grid;grid-template-columns:minmax(0,1.38fr) minmax(0,1fr);gap:52px}
.screen{position:sticky;top:calc(var(--bar) + var(--fi) + 22px);align-self:start}

/* 3-Way Reel Switcher above the video */
.reel-tabs{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-bottom:8px;
}
.reel-tabs button{
  flex:1;
  min-width:140px;
  font:500 10.5px/1.25 "IBM Plex Mono",monospace;
  letter-spacing:.06em;
  text-transform:uppercase;
  padding:7px 10px;
  border:1px solid var(--ink);
  background:var(--panel);
  color:var(--soft);
  text-align:center;
}
.reel-tabs button.active{
  background:var(--ink);
  color:var(--paper);
}

.vbox{position:relative;border:2px solid var(--ink);background:#121318}
video{width:100%;display:block;aspect-ratio:16/9;background:#121318}
.ctl{display:flex;align-items:center;gap:12px;margin-top:10px;color:var(--soft);flex-wrap:wrap}
.play{width:38px;height:38px;border:1.5px solid var(--ink);border-radius:50%;display:grid;place-items:center;flex:none}
.play::before{content:"";width:0;height:0;border-left:11px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent;margin-left:3px}
.play.on::before{width:10px;height:12px;border:0;border-left:3px solid var(--ink);border-right:3px solid var(--ink);margin:0}
.step-btn{
  font:500 10.5px/1 "IBM Plex Mono",monospace;
  padding:6px 9px;
  border:1px solid var(--ink);
  background:var(--panel);
  color:var(--ink);
}
.step-btn:hover{background:var(--ink);color:var(--paper)}
.ctl .tc{flex:1;font-variant-numeric:tabular-nums}
.ctl .hint{font-style:italic;font-size:15px}

/* Videotext Clock-Text Column */
.text{max-width:34em;padding-bottom:32vh}
.text p{margin:0;padding:.42em 0;cursor:pointer;transition:color .45s;position:relative;hyphens:auto}
.text p .w{text-transform:uppercase;font-size:.72em;letter-spacing:.13em;margin-right:.5em;color:var(--lamp)}
.text p.n{text-indent:1.4em}
.text p.first{text-indent:0}
.text p.first::first-letter{font-size:3.1em;float:left;line-height:.85;margin:.06em .08em 0 0}
.text p.f{font-size:1.18em;line-height:1.4;padding:.85em 1.1em .95em;text-align:center;border-top:1px solid rgba(28,24,20,0.15);border-bottom:1px solid rgba(28,24,20,0.15);margin:6px 0}
.text p.f .w{display:block;font-size:.62em;margin:0 0 .3em;color:var(--lamp)}
.text p.tape{font:500 11.5px/1.5 "IBM Plex Mono",monospace;letter-spacing:.04em;padding:.2em 0 .2em 1.2em;text-transform:uppercase}
.text p{color:var(--faint)}
.text p.said{color:var(--ink)}
.text p.now::before{content:"";position:absolute;left:-18px;top:.5em;bottom:.5em;border-left:2.5px solid var(--ink)}
.text p.f.now::before{left:0}
.gap{position:relative}
.gap::before{content:"";position:absolute;left:50%;top:6px;bottom:6px;border-left:1px dotted var(--faint)}
.gap.said::before{border-left-color:var(--ink)}
.gap .brk{position:absolute;left:50%;top:50%;width:56px;height:16px;margin:-8px 0 0 -28px;background:linear-gradient(var(--ink),var(--ink)) center/44px 1px no-repeat,var(--paper)}

/* On the film section */
.after{max-width:38em;margin:48px auto 0;padding:28px 28px 0;border-top:1px solid var(--ink)}
.after h2{font-weight:400;font-size:14px;letter-spacing:.24em;text-align:center;margin:0 0 20px}
.after dt{font-size:12px;letter-spacing:.18em;color:var(--lamp);margin:16px 0 3px;font-family:"IBM Plex Mono",monospace}
.after dd{margin:0;font-size:17.5px;line-height:1.55}

.nextcard{display:block;text-decoration:none;text-align:center;margin:80px auto 0;padding:54px 28px 110px;max-width:900px;border-top:1px solid var(--ink)}
.nextcard .sc{color:var(--lamp)}
.nextcard h3{font-weight:400;font-size:clamp(28px,4.4vw,48px);line-height:1.08;margin:12px 0 8px}
.nextcard p{font-style:italic;margin:0 0 22px;color:var(--soft)}
.nextcard img{width:min(520px,100%);border:1.5px solid var(--ink);display:block;margin:0 auto}
.nextcard:hover h3{text-decoration:underline;text-underline-offset:6px;text-decoration-thickness:1px}

.caption{display:none;text-align:center;max-width:780px;margin:20px auto 0;min-height:4.2em;font-size:23px;line-height:1.35}
.caption .w{display:block;font-size:12px;letter-spacing:.18em;color:var(--lamp);text-transform:uppercase;margin-bottom:4px;font-family:"IBM Plex Mono",monospace}

/* Film mode: the film alone, with its line under it */
.m-film .book{grid-template-columns:minmax(0,1fr);max-width:min(1120px,calc((100svh - var(--bar) - 200px) * 16 / 9 + 80px))}
.m-film .text{display:none}
.m-film .screen{position:static}
.m-film .caption{display:block}
.m-film .ctl .hint{display:none}

@media (max-width:920px){
  .book{grid-template-columns:minmax(0,1fr);gap:0;padding:0 calc(var(--fi) + 6px)}
  .screen{top:calc(var(--bar) + var(--fi) + 1px);z-index:20;background:var(--paper);padding:8px 0 8px;margin:0 -4px;border-bottom:1px solid var(--faint)}
  .text{padding-top:18px;margin:0 auto;padding-left:14px;padding-right:6px}
  .text p.now::before{left:-12px}
}

.sheet{position:fixed;inset:0;z-index:58;background:var(--paper);overflow:auto;padding:calc(var(--bar) + var(--fi) + 20px) 0 40px;display:none}
.sheet.open{display:block}
</style>
</head>
<body>
<div class="frame" aria-hidden="true"><i class="o"></i><i class="n"></i></div>
<div id="app"></div>

<script>
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s || '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const mmss = (s) => { s = Math.max(0, Math.round(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
const ROMAN = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII', 'IX', 'X', 'XI', 'XII', 'XIII', 'XIV'];
const letters = (s) => { let i = 0; return String(s).split(' ').map((w) => `<span class="wd" style="display:inline-block;white-space:nowrap">${[...w].map((c) => `<span style="--i:${i++}">${esc(c)}</span>`).join('')}</span>`).join(' '); };

let MANIFEST = null;
let cleanup = null;

function renderTocRows(curNum) {
  if (!MANIFEST) return '';
  let html = `<header class="gh"><span class="sc">THE COMPLETE 14-POEM VIDEOTEXT CYCLE</span><h3>Fourteen Poems, Fourteen Afterlight Picture Techniques</h3><p>Each poem is laid out on its film’s own clock, pairing its Common Places, Painted Cels, and City District palette with a bespoke visual effect from the Afterlight Screening Room.</p></header>`;
  MANIFEST.poems.forEach((p, idx) => {
    const rn = ROMAN[idx + 1] || String(idx + 1);
    const pal = [...(p.body_hex || []).slice(0, 4), ...(p.glow_hex || []).slice(0, 3)];
    const swHtml = pal.map(h => `<s style="background:${esc(h)}" title="${esc(h)}"></s>`).join('');
    html += `<a class="row${curNum === p.num ? ' cur' : ''}" href="#/${p.num}">
      <span class="rn">${rn}</span>
      <img class="th" src="${esc(p.poster)}" alt="" loading="lazy">
      <span class="nm"><b>P${esc(p.num)} · ${esc(p.title)}</b><span class="dist-pill">${esc(p.district_name)}</span><i></i></span>
      <span class="tm">${mmss(p.dur)}</span>
      <span class="sub">
        <span class="fx-tag">FX ${esc(p.fx_code)} · ${esc(p.fx_name)}</span>
        <span class="swatches">${swHtml}</span>
      </span>
      <span class="idea-line">“${esc(p.sub)}” — ${esc(p.idea)}</span>
    </a>`;
  });
  return html;
}

function homeView() {
  document.title = 'WYGWYL · Afterlight Videotext (14 Poems · 14 Picture Techniques)';
  document.body.classList.add('unfold');
  $('#app').innerHTML = `
    <section class="splash">
      <div class="eyebrow mono">WYGWYL × AFTERLIGHT · SOSUKE VIDEOTEXT &amp; SCREENING ROOM EDITION</div>
      <h1>${letters('AFTERLIGHT VIDEOTEXT')}</h1>
      <p class="it">Fourteen poems on the film’s own clock — each poem in its own Afterlight picture technique</p>
      <p class="by">Scroll through a poem’s text and the film moves with you; press play and the text moves with the film.</p>
      <div class="studio-links">
        <a href="#/01">▶ Start Chapter I (Poem 01 · Breath &amp; Embers)</a>
        <a href="atlas_splat_studio.html">🎥 Open 60fps WebGL Multiplane Studio &amp; 3-Reel Suite</a>
      </div>
      <a class="cue" href="#contents" aria-label="Contents"><span class="sc">Contents</span><b></b></a>
    </section>
    <section class="toc" id="contents">
      <h2 class="sc">Contents</h2>
      ${renderTocRows()}
    </section>
    <p class="colophon">
      Each chapter pairs one of the 14 WYGWYL poems with a signature picture technique from the Afterlight Screening Room (Breath on Glass, Makyō Magic Mirror, Falling Raindrop Video Lenses, Darkroom Tray &amp; Two-Block Linocut, Semantic 3D Heart-Scan Naming, Underwater Caustic Waterline, Radial Time-Delay Watercolour, Seeing-As Astral Smoke, Carry the Glow 3D Relighting, 9,000 Firefly Pinholes, 30-Course Nipkow Temple Assembly, Burning Hourglass Sand, Daimonji Revolving Lantern &amp; Gate Burn, and Warm Cave Thermal Scanline).
      <span class="mono">14 POEMS · 42 FILMS (14 AFTERLIGHT FX + 14 CONSTRUCT + 14 SPACETIME WORMS)<br><a href="atlas_splat_studio.html">RETURN TO FILMMAKER'S MULTIPLANE CAMERA STUDIO</a></span>
    </p>
  `;
  const cue = $('.cue');
  if (cue) cue.addEventListener('click', (e) => { e.preventDefault(); $('#contents').scrollIntoView({ behavior: 'smooth' }); });
}

function chapterView(numStr) {
  const idx = MANIFEST.poems.findIndex(p => p.num === numStr || parseInt(p.num, 10) === parseInt(numStr, 10));
  if (idx < 0) return homeView();
  const f = MANIFEST.poems[idx];
  const prev = MANIFEST.poems[idx - 1];
  const next = MANIFEST.poems[idx + 1];
  const rn = ROMAN[idx + 1] || f.num;

  document.title = `P${f.num} · ${f.title} (${f.fx_name}) · Afterlight Videotext`;
  document.body.classList.remove('unfold');

  const flat = [];
  (f.scenes || []).forEach((sc, si) => sc.forEach((l, li) => flat.push({ ...l, brk: si > 0 && li === 0 })));
  flat.sort((a, b) => a.t0 - b.t0);

  const PX = innerWidth < 900 ? 13 : 16;
  const gapEl = (t0, t1, brk) => {
    const h = Math.max(brk ? 68 : 14, Math.min(260, (t1 - t0) * PX));
    return `<div class="gap" data-t0="${t0}" data-t1="${t1}" style="height:${h}px">${brk ? '<span class="brk"></span>' : ''}</div>`;
  };

  let html = '', first = true, end = 0;
  flat.forEach((l, j) => {
    const gapT0 = j === 0 ? 0 : Math.max(end, flat[j - 1].t0);
    if (l.t0 - gapT0 > 0.4 || l.brk || j === 0) html += gapEl(gapT0, Math.max(gapT0, l.t0), l.brk);
    let cls = l.tape ? 'tape' : l.f ? 'f' : 'n';
    if (!l.tape && !l.f && first) { cls += ' first'; first = false; }
    html += `<p class="${cls}" data-j="${j}">${l.who ? `<span class="w">${esc(l.who)}.</span>` : ''}${esc(l.say)}</p>`;
    end = Math.max(end, l.t1);
  });
  html += gapEl(end, f.dur, false);

  const pal = [...(f.body_hex || []), ...(f.glow_hex || [])];
  const swHtml = pal.map(h => `<span style="display:inline-block;width:14px;height:14px;background:${esc(h)};border:1px solid #1c1814;vertical-align:middle;margin-right:3px" title="${esc(h)}"></span>`).join('');

  $('#app').innerHTML = `
    <nav class="bar">
      <div class="left-nav">
        <button class="sc tocb" id="tocb" aria-label="Contents"><span class="lbl">Contents</span></button>
        <a href="atlas_splat_studio.html#poem-${f.num}" class="mono" style="text-decoration:none;color:var(--lamp)">🎥 Studio Rig</a>
      </div>
      <div class="here"><span class="sc">${rn} · P${esc(f.num)}</span>${esc(f.title)} — <i>${esc(f.fx_name)}</i></div>
      <div class="nav">
        <div class="modes sc">
          <button data-m="book" aria-pressed="true">Book</button>
          <button data-m="film" aria-pressed="false">Film</button>
        </div>
        <a class="chev l" ${prev ? `href="#/${prev.num}" aria-label="Previous poem"` : 'disabled'}></a>
        <a class="chev r" ${next ? `href="#/${next.num}" aria-label="Next poem"` : 'disabled'}></a>
      </div>
      <div class="pr" id="pr"></div>
    </nav>

    <div class="sheet" id="sheet">
      <section class="toc"><h2 class="sc">Contents</h2>${renderTocRows(f.num)}</section>
    </div>

    <article class="chapter m-book" id="ch">
      <header class="chead">
        <div class="rn sc">CHAPTER ${rn} · POEM ${esc(f.num)} · ${esc(f.district_name)}</div>
        <h1>${letters(f.title.toUpperCase())}</h1>
        <p class="it">“${esc(f.sub)}”</p>
        <div class="fx-banner">
          <span>AFTERLIGHT FX [${esc(f.fx_code)}]: <b>${esc(f.fx_name.toUpperCase())}</b></span>
          <span>|</span>
          <span>${swHtml}</span>
        </div>
      </header>

      <div class="book">
        <div class="screen">
          <div class="reel-tabs">
            <button type="button" class="active" data-src="${esc(f.video_fx)}">✦ Afterlight FX (${esc(f.fx_code)})</button>
            <button type="button" data-src="${esc(f.video_construct)}">S2 · Fluid Construct</button>
            <button type="button" data-src="${esc(f.video_worm)}">07w · Spacetime Worm</button>
          </div>
          <div class="vbox">
            <video id="v" playsinline preload="auto" poster="${esc(f.poster)}" src="${esc(f.video_fx)}"></video>
          </div>
          <div class="ctl">
            <button class="play" id="pb" aria-label="Play"></button>
            <button class="step-btn" id="btn-back" title="Step back 1 frame (1/24s)">◀ -1f</button>
            <button class="step-btn" id="btn-fwd" title="Step forward 1 frame (1/24s)">+1f ▶</button>
            <span class="tc mono" id="tc">0:00 / ${mmss(f.dur)}</span>
            <span class="hint" id="hint">Scroll to move through the film</span>
          </div>
          <div class="caption" id="cap"></div>
        </div>

        <div class="text" id="text">${html}</div>
      </div>

      <section class="after">
        <h2 class="sc">On the Videotext &amp; Picture Technique</h2>
        <dl>
          <dt class="sc">Afterlight Lineage (${esc(f.fx_code)})</dt>
          <dd>${esc(f.afterlight_ref)} — <i>${esc(f.idea)}</i></dd>
          <dt class="sc">Picture</dt>
          <dd>${esc(f.picture)}</dd>
          <dt class="sc">Sound</dt>
          <dd>${esc(f.sound)}</dd>
          <dt class="sc">How It Was Made</dt>
          <dd>${esc(f.code)}</dd>
          <dt class="sc">The Poetic Line That Asked For It</dt>
          <dd>${esc(f.after)}</dd>
        </dl>
      </section>

      ${next ? `<a class="nextcard" href="#/${next.num}">
        <span class="sc">Next Chapter · ${ROMAN[idx + 2]} · FX ${esc(next.fx_code)}</span>
        <h3>P${esc(next.num)} · ${esc(next.title)} — ${esc(next.fx_name)}</h3>
        <p>“${esc(next.sub)}”</p>
        <img src="${esc(next.poster)}" alt="" loading="lazy">
      </a>` : `<a class="nextcard" href="#/">
        <span class="sc">The End of the 14-Poem Videotext Cycle</span>
        <h3>Return to Contents</h3>
        <p>Fourteen poems, fourteen Afterlight picture techniques</p>
      </a>`}
    </article>
  `;

  const v = $('#v'), ch = $('#ch'), els = $$('#text p, #text .gap'), ps = $$('#text p'), pr = $('#pr'), tc = $('#tc'), pb = $('#pb'), cap = $('#cap'), hint = $('#hint');

  // Reel switcher preserves playhead & playing state
  $$('.reel-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      $$('.reel-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const curT = v.currentTime || 0;
      const wasPlaying = !v.paused;
      v.src = btn.dataset.src;
      v.currentTime = curT;
      if (wasPlaying) v.play().catch(()=>{});
    });
  });

  // Map between page scroll position and film time
  let A = [];
  const layout = () => {
    A = [];
    for (const el of els) {
      const r = el.getBoundingClientRect(), y = r.top + scrollY;
      if (el.classList.contains('gap')) {
        A.push({ y, t: +el.dataset.t0 });
        A.push({ y: y + r.height, t: +el.dataset.t1 });
      } else {
        const l = flat[+el.dataset.j];
        A.push({ y, t: l.t0 });
      }
    }
    A.sort((a, b) => a.y - b.y);
    for (let k = 1; k < A.length; k++) if (A[k].t < A[k - 1].t) A[k].t = A[k - 1].t;
  };
  const readY = () => {
    if (innerWidth < 920) {
      const s = $('.screen').getBoundingClientRect();
      return s.bottom + (innerHeight - s.bottom) * 0.3;
    }
    return innerHeight * 0.42;
  };
  const off = () => {
    if (!A.length) return 0;
    const o = Math.max(0, readY() - A[0].y);
    return o * Math.max(0, 1 - scrollY / Math.max(200, A[0].y));
  };
  const tAt = (y) => {
    if (!A.length || y <= A[0].y) return 0;
    for (let k = 1; k < A.length; k++) {
      if (y < A[k].y) {
        const a = A[k - 1], b = A[k];
        return a.t + (b.t - a.t) * (y - a.y) / Math.max(1, b.y - a.y);
      }
    }
    return f.dur;
  };
  const yAt = (t) => {
    if (!A.length) return 0;
    if (t <= A[0].t) return A[0].y;
    for (let k = 1; k < A.length; k++) {
      if (t < A[k].t) {
        const a = A[k - 1], b = A[k];
        return a.y + (b.y - a.y) * (t - a.t) / Math.max(1e-6, b.t - a.t);
      }
    }
    return A[A.length - 1].y;
  };

  let lastNow = -1;
  const show = (t) => {
    for (const p of ps) p.classList.toggle('said', flat[+p.dataset.j].t0 <= t + 0.05);
    for (const g of $$('#text .gap')) g.classList.toggle('said', +g.dataset.t1 <= t + 0.05);
    let now = -1;
    for (let j = 0; j < flat.length; j++) {
      if (flat[j].tape) continue;
      if (flat[j].t0 <= t + 0.05) now = j;
    }
    if (now !== lastNow) {
      $$('#text p.now').forEach(p => p.classList.remove('now'));
      const p = ps.find(q => +q.dataset.j === now);
      if (p) p.classList.add('now');
      lastNow = now;
    }
    let live = null;
    for (const l of flat) if (!l.tape && t >= l.t0 - 0.05 && t <= l.t1 + 0.5) live = l;
    cap.innerHTML = live ? `${live.who ? `<span class="w">${esc(live.who)}</span>` : ''}${esc(live.say)}` : '';
    const ff = Math.floor(((t % 1) + 1e-4) * 24);
    tc.textContent = `${mmss(t)}:${String(ff).padStart(2,'0')} / ${mmss(f.dur)}`;
    pr.style.width = (100 * Math.min(1, t / f.dur)).toFixed(2) + '%';
  };

  let target = 0, seeking = false, idle = 0, following = false;
  const seek = (t, exact) => {
    target = Math.max(0, Math.min(f.dur - 0.04, t));
    if (seeking && !exact) return;
    if (Math.abs(v.currentTime - target) < 0.03) return;
    seeking = true;
    v.currentTime = target;
  };
  v.addEventListener('seeked', () => {
    seeking = false;
    if (!following && Math.abs(v.currentTime - target) > 0.05) seek(target, true);
  });

  let raf = 0;
  const onScroll = () => {
    if (following || ch.classList.contains('m-film')) return;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(() => {
      const t = tAt(scrollY + readY() - off());
      show(t);
      seek(t, false);
      clearTimeout(idle);
      idle = setTimeout(() => seek(t, true), 150);
    });
  };

  let fr = 0;
  const follow = () => {
    const t = v.currentTime;
    show(t);
    if (!ch.classList.contains('m-film')) {
      const y = Math.max(0, yAt(t) - readY());
      scrollTo(0, y);
    }
    fr = requestAnimationFrame(follow);
  };
  const play = () => {
    v.muted = false;
    following = true;
    pb.classList.add('on');
    pb.setAttribute('aria-label', 'Pause');
    hint.textContent = 'Scroll to take the film back';
    v.play().catch(() => stop());
    cancelAnimationFrame(fr);
    follow();
  };
  const stop = () => {
    following = false;
    v.pause();
    cancelAnimationFrame(fr);
    pb.classList.remove('on');
    pb.setAttribute('aria-label', 'Play');
    hint.textContent = 'Scroll to move through the film';
  };

  pb.addEventListener('click', () => (following ? stop() : play()));
  $('#btn-back').addEventListener('click', () => {
    stop();
    const nt = Math.max(0, v.currentTime - 1/24);
    v.currentTime = nt;
    show(nt);
  });
  $('#btn-fwd').addEventListener('click', () => {
    stop();
    const nt = Math.min(f.dur - 0.04, v.currentTime + 1/24);
    v.currentTime = nt;
    show(nt);
  });
  v.addEventListener('ended', stop);

  const userMove = () => { if (following && !ch.classList.contains('m-film')) stop(); };
  addEventListener('wheel', userMove, { passive: true });
  addEventListener('touchstart', userMove, { passive: true });
  const onKey = (e) => {
    if (['ArrowDown', 'ArrowUp', 'PageDown', 'PageUp', 'Home', 'End'].includes(e.key)) userMove();
    if (e.key === ' ' && e.target === document.body) { e.preventDefault(); following ? stop() : play(); }
  };
  addEventListener('keydown', onKey);
  addEventListener('scroll', onScroll, { passive: true });

  ps.forEach(p => p.addEventListener('click', () => {
    const l = flat[+p.dataset.j];
    stop();
    scrollTo({ top: Math.max(0, yAt(l.t0) - readY()), behavior: 'smooth' });
  }));

  const setMode = (m) => {
    ch.classList.toggle('m-film', m === 'film');
    ch.classList.toggle('m-book', m !== 'film');
    $$('.modes button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
    v.controls = m === 'film';
    hint.style.display = m === 'film' ? 'none' : '';
    requestAnimationFrame(() => { layout(); if (m !== 'film' && !following) onScroll(); });
  };
  $$('.modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.m)));

  const sheet = $('#sheet');
  $('#tocb').addEventListener('click', () => {
    sheet.classList.toggle('open');
    $('#tocb .lbl').textContent = sheet.classList.contains('open') ? 'Close' : 'Contents';
  });

  const onResize = () => { layout(); if (!following) onScroll(); };
  addEventListener('resize', onResize);
  layout();
  document.fonts && document.fonts.ready.then(() => { layout(); onScroll(); });

  cleanup = () => {
    stop();
    removeEventListener('scroll', onScroll);
    removeEventListener('wheel', userMove);
    removeEventListener('touchstart', userMove);
    removeEventListener('keydown', onKey);
    removeEventListener('resize', onResize);
  };
  show(0);
}

async function initApp() {
  MANIFEST = await fetch('data/terrarium/seeing_spacetime_films/videotext_manifest.json?v=9').then(r => r.json());
  function route() {
    if (cleanup) { cleanup(); cleanup = null; }
    const m = location.hash.match(/^#\/?(\d+)/);
    if (m) chapterView(m[1].padStart(2, '0'));
    else homeView();
    scrollTo(0, 0);
  }
  addEventListener('hashchange', route);
  route();
}
initApp();
</script>
</body>
</html>
