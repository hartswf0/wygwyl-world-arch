let AC=null,SND=null;

  // camera: push opens the filter (closer = brighter); truck sweeps the stereo field by parallax; tilt lifts brightness
  if(C.move==='push'||C.move==='crane_push')SND.tone.frequency.setTargetAtTime(1400+3200*e,t,.2);
  if(C.move==='tilt_up')SND.tone.frequency.setTargetAtTime(1800+2000*e,t,.2);
  if(C.move==='truck')SND.voices.forEach(v=>{if(v.pan)v.pan.pan.setTargetAtTime(Math.max(-1,Math.min(1,v.base-1.2*C.amp*10*v.par*e)),t,.2)});
  // characters pluck every 12 frames (half-second on twos), cycling through figures; height → pitch, x → pan
  const beat=Math.floor(f/12);if(beat!==SND.lastBeat&&C.chars.length){SND.lastBeat=beat;const c=C.chars[beat%C.chars.length];
    pluck(hz(220,Math.round((1-c.y)*8)),c.x*2-1);if(navigator.vibrate)navigator.vibrate(12)}
  // structure lines → rhythmic texture: more lines = denser ticks
  const every=C.lines>24?4:C.lines>8?6:C.lines>0?12:0,tk=every?Math.floor(f/every):-1;if(every&&tk!==SND.lastTick){SND.lastTick=tk;tick()}
}
setInterval(()=>{if(play)soundFrame()},1000/12);
document.getElementById('hear').onclick=e=>{if(!AC){startSound();e.target.textContent='🔇 mute'}else{AC.close();AC=null;SND=null;e.target.textContent='🔊 hear it'}};

<script id="wy-mobile-friendly-js">
(function(){
  function initMobileFriendly() {
    // 1. Add Mobile Panel Switcher for 3-column / 2-column workspaces
    var ws = document.querySelector('.workspace, .app, #studioApp, #appLayout, .layout');
    if (ws && ws.children.length >= 2 && !document.getElementById('wy-mob-switcher')) {
      var kids = Array.prototype.slice.call(ws.children).filter(function(el){
        var tag = el.tagName.toLowerCase();
        return tag !== 'script' && tag !== 'style';
      });
      if (kids.length >= 2 && kids.length <= 4) {
        var bar = document.createElement('div');
        bar.id = 'wy-mob-switcher';
        var labels = kids.length === 3
          ? ['☰ All Panels', '🎬 Stage View', '🎛️ Left Controls', '📊 Right Inspector']
          : ['☰ All Panels', '🎬 Main View', '🎛️ Side Panel'];
        var mapIdx = kids.length === 3 ? [-1, 1, 0, 2] : [-1, 0, 1];
        // Check if first child is main/stage
        if (kids.length === 2 && (kids[1].tagName === 'MAIN' || kids[1].querySelector('canvas'))) {
          mapIdx = [-1, 1, 0];
        }
        labels.forEach(function(lbl, bIdx) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = lbl;
          if (bIdx === 0) btn.classList.add('on');
          btn.addEventListener('click', function() {
            Array.prototype.forEach.call(bar.querySelectorAll('button'), function(b){ b.classList.remove('on'); });
            btn.classList.add('on');
            var target = mapIdx[bIdx];
            kids.forEach(function(k, kIdx) {
              if (target === -1 || kIdx === target) {
                k.classList.remove('wy-mob-hidden');
              } else {
                k.classList.add('wy-mob-hidden');
              }
            });
            window.dispatchEvent(new Event('resize'));
          });
          bar.appendChild(btn);
        });
        ws.parentNode.insertBefore(bar, ws);
      }
    }

    // 2. Touch-to-Mouse synthetic bridge for interactive 2D canvases
    var canvases = document.querySelectorAll('canvas:not(#gl):not(#viewport)');
    Array.prototype.forEach.call(canvases, function(cv) {
      if (cv.dataset.wyTouchBridged) return;
      cv.dataset.wyTouchBridged = '1';
      function dispatchMouse(type, touch) {
        var evt = new MouseEvent(type, {
          bubbles: true,
          cancelable: true,
          view: window,
          clientX: touch.clientX,
          clientY: touch.clientY,
          screenX: touch.screenX,
          screenY: touch.screenY,
          button: 0,
          buttons: type === 'mouseup' ? 0 : 1
        });
        cv.dispatchEvent(evt);
      }
      cv.addEventListener('touchstart', function(e) {
        if (e.touches.length === 1) {
          dispatchMouse('mousedown', e.touches[0]);
        }
      }, { passive: true });
      cv.addEventListener('touchmove', function(e) {
        if (e.touches.length === 1) {
          dispatchMouse('mousemove', e.touches[0]);
        }
      }, { passive: true });
      cv.addEventListener('touchend', function(e) {
        if (e.changedTouches.length > 0) {
          dispatchMouse('mouseup', e.changedTouches[0]);
        }
      }, { passive: true });
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initMobileFriendly);
  } else {
    initMobileFriendly();
  }
})();
</script>
