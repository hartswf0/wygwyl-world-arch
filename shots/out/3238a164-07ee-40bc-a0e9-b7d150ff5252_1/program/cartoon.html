  if(C.move==='truck')SND.voices.forEach(v=>{if(v.pan)v.pan.pan.setTargetAtTime(Math.max(-1,Math.min(1,v.base-1.2*C.amp*10*v.par*e)),t,.2)});

  const beat=Math.floor(f/12);if(beat!==SND.lastBeat&&C.chars.length){SND.lastBeat=beat;const c=C.chars[beat%C.chars.length];
    pluck(hz(220,Math.round((1-c.y)*8)),c.x*2-1);if(navigator.vibrate)navigator.vibrate(12)}

setInterval(()=>{if(play)soundFrame()},1000/12);

<script id="wy-mobile-friendly-js">
(function(){
  function initMobileFriendly() {
    // 1. Add Mobile Panel Switcher for 3-column / 2-column workspaces
    var ws = document.querySelector('.workspace, .app, #studioApp, #appLayout, .layout');
    if (ws && ws.children.length >= 2 && !document.getElementById('wy-mob-switcher')) {
      var kids = Array.prototype.slice.call(ws.children).filter(function(el){
        var tag = el.tagName.toLowerCase();

        var mapIdx = kids.length === 3 ? [-1, 1, 0, 2] : [-1, 0, 1];

        if (kids.length === 2 && (kids[1].tagName === 'MAIN' || kids[1].querySelector('canvas'))) {
          mapIdx = [-1, 1, 0];
        }
        labels.forEach(function(lbl, bIdx) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.textContent = lbl;
          if (bIdx === 0) btn.classList.add('on');
          btn.addEventListener('click', function() {
            Array.prototype.forEach.call(bar.querySelectorAll('button'), function(b){ b.classList.remove('on'); });
            btn.classList.add('on');
            var target = mapIdx[bIdx];

              } else {

        });
        ws.parentNode.insertBefore(bar, ws);
      }
    }

    var canvases = document.querySelectorAll('canvas:not(#gl):not(#viewport)');

    });
  }

  } else {

  }
})();
