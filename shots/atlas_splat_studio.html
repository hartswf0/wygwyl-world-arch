<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>3D Gaussian Splat World · All 10 Districts (Apple ml-sharp)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #070b12;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #f3ead2;
    }
    #three-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: block;
      cursor: grab;
      touch-action: none;
    }
    #three-canvas:active {
      cursor: grabbing;
    }

    #hud-dock {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      max-width: 96vw;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #hud-dock.hidden {
      opacity: 0;
      pointer-events: none !important;
    }
    .dock-row {
      pointer-events: auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      gap: 4px;
      background: rgba(6, 10, 16, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 4px 9px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    .pill-btn {
      background: transparent;
      color: rgba(243, 234, 210, 0.85);
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 11.5px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.12s ease;
    }
    .pill-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.12);
    }
    .pill-btn.active {
      background: #ffd23f;
      color: #06090e;
      border-color: #ffd23f;
    }
    .pill-btn.teal.active {
      background: #19e6c8;
      color: #041014;
      border-color: #19e6c8;
    }
    .pill-btn.coral.active {
      background: #ff3d6e;
      color: #fff;
      border-color: #ff3d6e;
    }
    .sep {
      width: 1px;
      height: 16px;
      background: rgba(255, 255, 255, 0.18);
      margin: 0 3px;
    }
    #btn-hide-ui {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 30;
      background: rgba(6, 10, 16, 0.55);
      color: rgba(243, 234, 210, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      padding: 5px 11px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>
  <canvas id="three-canvas"></canvas>

  <button id="btn-hide-ui" type="button" title="Toggle UI (Key: H)">👁️ UI [H]</button>

  <div id="hud-dock">
    <div class="dock-row">
      <div id="portal-pills" style="display:flex;align-items:center;gap:3px;flex-wrap:wrap;"></div>
      <div class="sep"></div>
      <button class="pill-btn teal active" id="mode-sharp" type="button">🟢 SHARP 2-Layer 3DGS</button>
      <button class="pill-btn teal" id="mode-xray" type="button">🔵 Layer-1 Disocclusion X-Ray</button>
      <button class="pill-btn teal" id="mode-l0" type="button">🟡 Layer-0 Only (No Disocclusion)</button>
      <button class="pill-btn coral" id="mode-before" type="button">🔴 Legacy Before</button>
      <div class="sep"></div>
      <button class="pill-btn teal active" id="btn-sway" type="button">🔄 Auto-Parallax</button>
      <button class="pill-btn" id="btn-reset" type="button">🎯 Center [R]</button>
    </div>

    <div class="dock-row" id="district-pills"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';

    const STATE = {
      manifest: null,
      activeDistrictKey: 'fells-point',
      activeCamIdx: 0,
      renderMode: 'sharp', // 'sharp' | 'xray' | 'l0' | 'before'
      autoSway: true,
      swayTime: 0,
      allParsed: null,
      stageData: null,
      basis: null,
      // Smooth spring-damped 3D camera controller state inside the room
      curR: 0, curU: 0, curF: 0, curYaw: 0, curPitch: 0,
      tgtR: 0, tgtU: 0, tgtF: 0, tgtYaw: 0, tgtPitch: 0,
    };

    const canvas = document.getElementById('three-canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.outputColorSpace = THREE.SRGBColorSpace;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070b12);

    const camera = new THREE.PerspectiveCamera(23, window.innerWidth / window.innerHeight, 0.2, 400);
    const splatGroup = new THREE.Group();
    scene.add(splatGroup);

    let splatMesh = null;

    function computeCameraBasis(pos, look) {
      const px = pos[0], py = pos[1], pz = pos[2];
      let fx = look[0] - px, fy = look[1] - py, fz = look[2] - pz;
      const flen = Math.hypot(fx, fy, fz) || 1.0;
      fx /= flen; fy /= flen; fz /= flen;

      let rx = -fz, ry = 0, rz = fx;
      const rlen = Math.hypot(rx, ry, rz) || 1.0;
      rx /= rlen; ry /= rlen; rz /= rlen;

      const ux = ry * fz - rz * fy;
      const uy = rz * fx - rx * fz;
      const uz = rx * fy - ry * fx;
      return { P: [px, py, pz], R: [rx, ry, rz], U: [ux, uy, uz], F: [fx, fy, fz], dist: flen };
    }

    function updateViewportUniforms() {
      renderer.setSize(window.innerWidth, window.innerHeight, false);
      camera.aspect = window.innerWidth / window.innerHeight;
      // Adapt vertical FOV to aspect ratio so the 2.15:1 cinema splat stage always fills the screen comfortably
      const targetHorizFovRad = THREE.MathUtils.degToRad(50.0);
      const vertFovRad = 2.0 * Math.atan(Math.tan(targetHorizFovRad * 0.5) / Math.max(1.15, camera.aspect));
      camera.fov = THREE.MathUtils.radToDeg(vertFovRad);
      camera.updateProjectionMatrix();

      if (splatMesh && splatMesh.material.uniforms) {
        const focalDevPx = renderer.domElement.height / (2.0 * Math.tan(vertFovRad * 0.5));
        splatMesh.material.uniforms.uFocalPx.value = focalDevPx;
      }
    }
    window.addEventListener('resize', updateViewportUniforms);

    // ── PARSE `.SPLAT` BINARY ──
    function parse32ByteSplatBuffer(arrayBuffer) {
      const count = Math.floor(arrayBuffer.byteLength / 32);
      const dv = new DataView(arrayBuffer);
      const basePositions = new Float32Array(count * 3);
      const baseColors = new Float32Array(count * 3);
      const baseAlphas = new Float32Array(count);
      const baseScales = new Float32Array(count);
      const isLayer1 = new Uint8Array(count);
      const camIdx = new Uint8Array(count);
      const dzLegacy = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        const off = i * 32;
        basePositions[i * 3 + 0] = dv.getFloat32(off + 0, true);
        basePositions[i * 3 + 1] = dv.getFloat32(off + 4, true);
        basePositions[i * 3 + 2] = dv.getFloat32(off + 8, true);

        const sx = dv.getFloat32(off + 12, true);
        const sy = dv.getFloat32(off + 16, true);
        const sz = dv.getFloat32(off + 20, true);
        baseScales[i] = Math.max(0.16, Math.min(0.65, (sx + sy + sz) / 3.0));

        baseColors[i * 3 + 0] = dv.getUint8(off + 24) / 255.0;
        baseColors[i * 3 + 1] = dv.getUint8(off + 25) / 255.0;
        baseColors[i * 3 + 2] = dv.getUint8(off + 26) / 255.0;
        baseAlphas[i] = Math.max(0.35, dv.getUint8(off + 27) / 255.0);

        const q0 = dv.getUint8(off + 28);
        const q1 = dv.getUint8(off + 29);
        const q2 = dv.getUint8(off + 30);
        const q3 = dv.getUint8(off + 31);

        isLayer1[i] = (q0 === 255) ? 1 : 0;
        camIdx[i] = q1;
        const u16 = q2 | (q3 << 8);
        dzLegacy[i] = (q0 === 128 && q2 === 128) ? 0.0 : ((u16 / 65535.0) * 30.0 - 15.0);
      }
      return { count, basePositions, baseColors, baseAlphas, baseScales, isLayer1, camIdx, dzLegacy };
    }

    // Extract active camera stage's Gaussians and allocate counting-sort buffers
    const NUM_BUCKETS = 2048;
    const bucketCounts = new Int32Array(NUM_BUCKETS);
    const bucketOffsets = new Int32Array(NUM_BUCKETS);

    function buildActiveStageSplatMesh() {
      while (splatGroup.children.length > 0) {
        const c = splatGroup.children[0];
        splatGroup.remove(c);
        if (c.geometry) c.geometry.dispose();
      }
      splatMesh = null;
      if (!STATE.allParsed) return;

      const all = STATE.allParsed;
      const targetCam = STATE.activeCamIdx;

      // Count how many Gaussians belong to targetCam
      let nStage = 0;
      for (let i = 0; i < all.count; i++) {
        if (all.camIdx[i] === targetCam) nStage++;
      }
      if (nStage === 0) return;

      const uPos = new Float32Array(nStage * 3); // Unsorted stage positions (after mode/legacy displacement)
      const uCol = new Float32Array(nStage * 3);
      const uAlp = new Float32Array(nStage);
      const uScl = new Float32Array(nStage);
      const sBasePos = new Float32Array(nStage * 3);
      const sBaseCol = new Float32Array(nStage * 3);
      const sBaseAlp = new Float32Array(nStage);
      const sBaseScl = new Float32Array(nStage);
      const sIsL1 = new Uint8Array(nStage);
      const sDzLeg = new Float32Array(nStage);

      let k = 0;
      for (let i = 0; i < all.count; i++) {
        if (all.camIdx[i] !== targetCam) continue;
        sBasePos[k * 3 + 0] = all.basePositions[i * 3 + 0];
        sBasePos[k * 3 + 1] = all.basePositions[i * 3 + 1];
        sBasePos[k * 3 + 2] = all.basePositions[i * 3 + 2];
        sBaseCol[k * 3 + 0] = all.baseColors[i * 3 + 0];
        sBaseCol[k * 3 + 1] = all.baseColors[i * 3 + 1];
        sBaseCol[k * 3 + 2] = all.baseColors[i * 3 + 2];
        sBaseAlp[k] = all.baseAlphas[i];
        sBaseScl[k] = all.baseScales[i];
        sIsL1[k] = all.isLayer1[i];
        sDzLeg[k] = all.dzLegacy[i];
        k++;
      }

      // Sorted attribute buffers sent to GPU
      const sortedPos = new Float32Array(nStage * 3);
      const sortedCol = new Float32Array(nStage * 3);
      const sortedAlp = new Float32Array(nStage);
      const sortedScl = new Float32Array(nStage);
      const depthKeys = new Uint16Array(nStage);
      const sortedIndices = new Int32Array(nStage);

      STATE.stageData = {
        nStage,
        uPos, uCol, uAlp, uScl,
        sBasePos, sBaseCol, sBaseAlp, sBaseScl, sIsL1, sDzLeg,
        sortedPos, sortedCol, sortedAlp, sortedScl,
        depthKeys, sortedIndices,
      };

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(sortedPos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(sortedCol, 3));
      geo.setAttribute('aAlpha', new THREE.BufferAttribute(sortedAlp, 1));
      geo.setAttribute('aScale', new THREE.BufferAttribute(sortedScl, 1));

      const mat = new THREE.ShaderMaterial({
        uniforms: {
          uFocalPx: { value: 2000.0 },
        },
        vertexShader: `
          attribute float aScale;
          attribute float aAlpha;
          varying vec3 vColor;
          varying float vAlpha;
          uniform float uFocalPx;
          void main() {
            vColor = color;
            vAlpha = aAlpha;
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            gl_Position = projectionMatrix * mvPosition;
            float dist = max(1.2, -mvPosition.z);
            // Perspective-accurate Gaussian footprint scaled to Retina viewport focal length
            gl_PointSize = clamp(aScale * (uFocalPx / dist) * 0.42, 4.0, 110.0);
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vAlpha;
          void main() {
            if (vAlpha <= 0.01) discard;
            vec2 cxy = 2.0 * gl_PointCoord - 1.0;
            float r2 = dot(cxy, cxy);
            if (r2 > 1.0) discard;
            // True 2D Gaussian radial falloff exp(-2.2 * r^2)
            float gauss = exp(-2.25 * r2);
            gl_FragColor = vec4(vColor, vAlpha * gauss);
          }
        `,
        vertexColors: true,
        transparent: true,
        depthTest: true,
        depthWrite: false,
        blending: THREE.NormalBlending,
      });

      splatMesh = new THREE.Points(geo, mat);
      splatMesh.frustumCulled = false;
      splatGroup.add(splatMesh);

      updateViewportUniforms();
      applySplatModeToStageData();
      sortStageSplatsBackToFront();
    }

    function applySplatModeToStageData() {
      const sd = STATE.stageData;
      if (!sd || !STATE.basis) return;
      const mode = STATE.renderMode;
      const fx = STATE.basis.F[0], fy = STATE.basis.F[1], fz = STATE.basis.F[2];

      for (let i = 0; i < sd.nStage; i++) {
        const i3 = i * 3;
        const l1 = sd.sIsL1[i] === 1;
        const bx = sd.sBasePos[i3 + 0], by = sd.sBasePos[i3 + 1], bz = sd.sBasePos[i3 + 2];
        const br = sd.sBaseCol[i3 + 0], bg = sd.sBaseCol[i3 + 1], bb = sd.sBaseCol[i3 + 2];

        if ((mode === 'l0' || mode === 'before') && l1) {
          sd.uPos[i3 + 0] = bx;
          sd.uPos[i3 + 1] = by;
          sd.uPos[i3 + 2] = bz;
          sd.uAlp[i] = 0.0;
          sd.uScl[i] = 0.0;
          continue;
        }

        const dz = (mode === 'before') ? sd.sDzLeg[i] : 0.0;
        sd.uPos[i3 + 0] = bx + fx * dz;
        sd.uPos[i3 + 1] = by + fy * dz;
        sd.uPos[i3 + 2] = bz + fz * dz;
        sd.uAlp[i] = sd.sBaseAlp[i];
        sd.uScl[i] = sd.sBaseScl[i];

        if (mode === 'xray' && l1) {
          sd.uCol[i3 + 0] = 0.08;
          sd.uCol[i3 + 1] = 0.96;
          sd.uCol[i3 + 2] = 0.86;
          sd.uAlp[i] = 0.95;
        } else if (mode === 'before') {
          const tint = Math.min(0.4, Math.abs(dz) * 0.05);
          sd.uCol[i3 + 0] = Math.min(1.0, br + tint * 0.85);
          sd.uCol[i3 + 1] = bg * (1.0 - tint * 0.35);
          sd.uCol[i3 + 2] = bb * (1.0 - tint * 0.55);
        } else {
          sd.uCol[i3 + 0] = br;
          sd.uCol[i3 + 1] = bg;
          sd.uCol[i3 + 2] = bb;
        }
      }

      ['sharp', 'xray', 'l0', 'before'].forEach(m => {
        document.getElementById(`mode-${m}`).classList.toggle('active', mode === m);
      });
    }

    // O(N) 2048-Bucket Back-to-Front Counting Sort (~0.7ms per frame)
    const camFwd = new THREE.Vector3();
    function sortStageSplatsBackToFront() {
      const sd = STATE.stageData;
      if (!sd || !splatMesh) return;

      camera.getWorldDirection(camFwd);
      const cx = camera.position.x, cy = camera.position.y, cz = camera.position.z;
      const fx = camFwd.x, fy = camFwd.y, fz = camFwd.z;

      const n = sd.nStage;
      const uPos = sd.uPos;
      const keys = sd.depthKeys;

      bucketCounts.fill(0);

      // Map depth in [0.5m .. 40.5m] -> bucket [2047 .. 0] so FARTHEST Gaussians come FIRST!
      const scale = (NUM_BUCKETS - 1) / 40.0;
      for (let i = 0; i < n; i++) {
        const i3 = i * 3;
        const d = (uPos[i3 + 0] - cx) * fx + (uPos[i3 + 1] - cy) * fy + (uPos[i3 + 2] - cz) * fz;
        // Invert depth so largest distance -> bucket 0 (drawn first), smallest distance -> bucket 2047 (drawn last on top)
        let b = Math.floor((40.5 - d) * scale);
        if (b < 0) b = 0;
        else if (b >= NUM_BUCKETS) b = NUM_BUCKETS - 1;
        keys[i] = b;
        bucketCounts[b]++;
      }

      let offset = 0;
      for (let b = 0; b < NUM_BUCKETS; b++) {
        bucketOffsets[b] = offset;
        offset += bucketCounts[b];
      }

      const sortedIdx = sd.sortedIndices;
      for (let i = 0; i < n; i++) {
        const b = keys[i];
        sortedIdx[bucketOffsets[b]++] = i;
      }

      const sPos = sd.sortedPos, sCol = sd.sortedCol, sAlp = sd.sortedAlp, sScl = sd.sortedScl;
      const uCol = sd.uCol, uAlp = sd.uAlp, uScl = sd.uScl;

      for (let j = 0; j < n; j++) {
        const i = sortedIdx[j];
        const j3 = j * 3, i3 = i * 3;
        sPos[j3 + 0] = uPos[i3 + 0];
        sPos[j3 + 1] = uPos[i3 + 1];
        sPos[j3 + 2] = uPos[i3 + 2];
        sCol[j3 + 0] = uCol[i3 + 0];
        sCol[j3 + 1] = uCol[i3 + 1];
        sCol[j3 + 2] = uCol[i3 + 2];
        sAlp[j] = uAlp[i];
        sScl[j] = uScl[i];
      }

      splatMesh.geometry.attributes.position.needsUpdate = true;
      splatMesh.geometry.attributes.color.needsUpdate = true;
      splatMesh.geometry.attributes.aAlpha.needsUpdate = true;
      splatMesh.geometry.attributes.aScale.needsUpdate = true;
    }

    function resetCameraToStageCenter() {
      STATE.tgtR = 0;
      STATE.tgtU = 0;
      STATE.tgtF = 0;
      STATE.tgtYaw = 0;
      STATE.tgtPitch = 0;
    }

    // ── INTUITIVE, BOUNDED 3D ROOM PARALLAX & WALK CONTROLLER ──
    let isDragging = false;
    let dragButton = 0;
    let lastX = 0, lastY = 0;

    canvas.addEventListener('pointerdown', (e) => {
      isDragging = true;
      dragButton = e.button;
      lastX = e.clientX;
      lastY = e.clientY;
      canvas.setPointerCapture(e.pointerId);
      // Pause auto-sway when user grabs the view
      if (STATE.autoSway) {
        STATE.autoSway = false;
        document.getElementById('btn-sway').classList.remove('active');
      }
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!isDragging) return;
      const dx = (e.clientX - lastX) / window.innerWidth;
      const dy = (e.clientY - lastY) / window.innerHeight;
      lastX = e.clientX;
      lastY = e.clientY;

      if (dragButton === 2 || e.shiftKey) {
        // Right-drag or Shift+drag: pure truck left/right & pedestal up/down
        STATE.tgtR = Math.max(-2.6, Math.min(2.6, STATE.tgtR - dx * 5.0));
        STATE.tgtU = Math.max(-1.4, Math.min(1.4, STATE.tgtU + dy * 3.5));
      } else {
        // Left-drag: coupled 3D parallax shift + smooth look rotation around room center!
        STATE.tgtR = Math.max(-2.4, Math.min(2.4, STATE.tgtR - dx * 4.2));
        STATE.tgtU = Math.max(-1.2, Math.min(1.2, STATE.tgtU + dy * 2.8));
        STATE.tgtYaw = Math.max(-0.26, Math.min(0.26, STATE.tgtYaw + dx * 0.45));
        STATE.tgtPitch = Math.max(-0.16, Math.min(0.16, STATE.tgtPitch + dy * 0.32));
      }
    });

    ['pointerup', 'pointercancel'].forEach(ev => {
      canvas.addEventListener(ev, () => { isDragging = false; });
    });
    canvas.addEventListener('contextmenu', (e) => e.preventDefault());
    canvas.addEventListener('dblclick', () => resetCameraToStageCenter());

    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      // Smoothly dolly forward/backward inside the room within safe bounds [-2.2m .. +4.8m]
      STATE.tgtF = Math.max(-2.2, Math.min(4.8, STATE.tgtF - e.deltaY * 0.004));
    }, { passive: false });

    const keys = new Set();
    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (k === 'h') {
        document.getElementById('hud-dock').classList.toggle('hidden');
        return;
      }
      if (k === 'r' || k === ' ') {
        resetCameraToStageCenter();
        return;
      }
      keys.add(k);
    });
    window.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));

    function updateCameraPose(dt) {
      if (!STATE.basis) return;

      // Keyboard WASD / Arrow movement inside safe room bounds
      if (keys.size > 0) {
        if (STATE.autoSway) {
          STATE.autoSway = false;
          document.getElementById('btn-sway').classList.remove('active');
        }
        const spd = 2.8 * dt;
        if (keys.has('w') || keys.has('arrowup')) STATE.tgtF = Math.min(4.8, STATE.tgtF + spd);
        if (keys.has('s') || keys.has('arrowdown')) STATE.tgtF = Math.max(-2.2, STATE.tgtF - spd);
        if (keys.has('d') || keys.has('arrowright')) STATE.tgtR = Math.min(2.6, STATE.tgtR + spd * 0.8);
        if (keys.has('a') || keys.has('arrowleft')) STATE.tgtR = Math.max(-2.6, STATE.tgtR - spd * 0.8);
        if (keys.has('e')) STATE.tgtU = Math.min(1.4, STATE.tgtU + spd * 0.6);
        if (keys.has('q')) STATE.tgtU = Math.max(-1.4, STATE.tgtU - spd * 0.6);
      }

      // Gentle figure-8 3D parallax sway when Auto-Parallax is active so 3D depth is immediately visible
      let swayR = 0, swayU = 0, swayF = 0;
      if (STATE.autoSway) {
        STATE.swayTime += dt;
        swayR = Math.sin(STATE.swayTime * 1.15) * 1.15;
        swayU = Math.cos(STATE.swayTime * 0.85) * 0.38;
        swayF = Math.sin(STATE.swayTime * 0.65) * 0.85;
      }

      const damp = Math.min(1.0, dt * 10.0);
      STATE.curR += ((STATE.tgtR + swayR) - STATE.curR) * damp;
      STATE.curU += ((STATE.tgtU + swayU) - STATE.curU) * damp;
      STATE.curF += ((STATE.tgtF + swayF) - STATE.curF) * damp;
      STATE.curYaw += (STATE.tgtYaw - STATE.curYaw) * damp;
      STATE.curPitch += (STATE.tgtPitch - STATE.curPitch) * damp;

      const { P, R, U, F, dist } = STATE.basis;
      const baseAdvance = 0.6 + STATE.curF;

      const cx = P[0] + R[0] * STATE.curR + U[0] * STATE.curU + F[0] * baseAdvance;
      const cy = P[1] + R[1] * STATE.curR + U[1] * STATE.curU + F[1] * baseAdvance;
      const cz = P[2] + R[2] * STATE.curR + U[2] * STATE.curU + F[2] * baseAdvance;
      camera.position.set(cx, cy, cz);

      // Look toward the stage centroid at median depth (`~10.5m` ahead of P), plus slight user yaw/pitch
      const focusDist = Math.max(9.0, Math.min(16.0, dist)) * 0.92;
      const lx = P[0] + F[0] * focusDist + R[0] * (STATE.curYaw * focusDist * 0.6 + STATE.curR * 0.22) + U[0] * (-STATE.curPitch * focusDist * 0.6 + STATE.curU * 0.22);
      const ly = P[1] + F[1] * focusDist + R[1] * (STATE.curYaw * focusDist * 0.6 + STATE.curR * 0.22) + U[1] * (-STATE.curPitch * focusDist * 0.6 + STATE.curU * 0.22);
      const lz = P[2] + F[2] * focusDist + R[2] * (STATE.curYaw * focusDist * 0.6 + STATE.curR * 0.22) + U[2] * (-STATE.curPitch * focusDist * 0.6 + STATE.curU * 0.22);
      camera.lookAt(lx, ly, lz);

      sortStageSplatsBackToFront();
    }

    function activatePortal(camIdx) {
      STATE.activeCamIdx = camIdx;
      const cam = STATE.orderedCams[camIdx];
      if (!cam) return;
      STATE.basis = computeCameraBasis(cam.threejs_pose.position_m, cam.threejs_pose.look_at_m);
      resetCameraToStageCenter();
      STATE.curR = 0; STATE.curU = 0; STATE.curF = 0; STATE.curYaw = 0; STATE.curPitch = 0;
      buildActiveStageSplatMesh();
    }

    async function selectDistrict(dKey) {
      const d = STATE.manifest.districts[dKey];
      if (!d) return;
      STATE.activeDistrictKey = dKey;

      document.querySelectorAll('#district-pills .pill-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.district === dKey);
      });

      const heroRef = d.splat_seed && d.splat_seed.hero_ref;
      const ordered = [];
      (d.cameras || []).forEach(c => {
        if (heroRef && c.ref_id === heroRef && ordered.length === 0) ordered.unshift(c);
        else if (heroRef && c.ref_id === heroRef) ordered.unshift(c);
        else ordered.push(c);
      });
      STATE.orderedCams = ordered;

      const portalContainer = document.getElementById('portal-pills');
      portalContainer.innerHTML = '';
      ordered.forEach((cam, idx) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'pill-btn' + (idx === 0 ? ' active' : '');
        b.textContent = idx === 0 ? `★ View ${cam.set_piece} (SHARP)` : `View ${cam.set_piece}`;
        b.addEventListener('click', () => {
          portalContainer.querySelectorAll('.pill-btn').forEach((el, i) => el.classList.toggle('active', i === idx));
          activatePortal(idx);
        });
        portalContainer.appendChild(b);
      });

      const splatUrl = (d.splat_seed && d.splat_seed.file) || `data/terrarium/atlas_packs/splats/district_${dKey}_sharp.splat`;
      const res = await fetch(splatUrl);
      if (res.ok) {
        const buf = await res.arrayBuffer();
        STATE.allParsed = parse32ByteSplatBuffer(buf);
      }

      activatePortal(0);
    }

    // Wire UI buttons
    ['sharp', 'xray', 'l0', 'before'].forEach(m => {
      document.getElementById(`mode-${m}`).addEventListener('click', () => {
        STATE.renderMode = m;
        applySplatModeToStageData();
        sortStageSplatsBackToFront();
      });
    });

    document.getElementById('btn-sway').addEventListener('click', (e) => {
      STATE.autoSway = !STATE.autoSway;
      e.currentTarget.classList.toggle('active', STATE.autoSway);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      resetCameraToStageCenter();
    });

    document.getElementById('btn-hide-ui').addEventListener('click', () => {
      document.getElementById('hud-dock').classList.toggle('hidden');
    });

    async function init() {
      const res = await fetch('data/terrarium/atlas_packs/atlas_infrastructure_manifest.json');
      STATE.manifest = await res.json();

      const districtContainer = document.getElementById('district-pills');
      const shortNames = {
        'mount-vernon': 'Mount Vernon',
        'woodberry': 'Woodberry',
        'holland-island': 'Holland Island',
        'assateague': 'Assateague',
        'teotihuacan': 'Teotihuacán',
        'centro': 'Centro Histórico',
        'condesa': 'Condesa',
        'tres-marias': 'Tres Marías',
        'inner-harbor': 'Inner Harbor',
        'fells-point': 'Fells Point',
      };

      Object.keys(STATE.manifest.districts).forEach(dKey => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'pill-btn';
        b.dataset.district = dKey;
        b.textContent = shortNames[dKey] || dKey;
        b.addEventListener('click', () => selectDistrict(dKey));
        districtContainer.appendChild(b);
      });

      const q = new URLSearchParams(location.search);
      const qDistrict = q.get('district');
      const initial = (qDistrict && STATE.manifest.districts[qDistrict]) ? qDistrict : 'fells-point';
      await selectDistrict(initial);
    }
    init();

    let lastTime = performance.now();
    function animate(now) {
      requestAnimationFrame(animate);
      const dt = Math.min(0.05, (now - lastTime) * 0.001);
      lastTime = now;
      updateCameraPose(dt);
      renderer.render(scene, camera);
    }
    requestAnimationFrame(animate);
  </script>
</body>
</html>
