*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}

const $ = s => document.querySelector(s);

const load = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('img ' + src)); i.src = src; });

async function boot() {

  PID = q.get('p') || PASSAGES.default;
  const P = PASSAGES.passages.find(p => p.id === PID) || PASSAGES.passages[0]; PID = P.id;
  CLIP = await json('weave/' + P.clip);
  const ids = Object.keys(CLIP.images);
  const ims = await Promise.all(ids.map(k => load('weave/' + CLIP.images[k])));
  ids.forEach((k, i) => IMG[k] = (CLIP.masks || []).includes(k) ? lumaToAlpha(ims[i]) : ims[i]);

  const used = new Set();
  for (const fr of CLIP.frames) for (const o of fr.draw) for (const key of ['id']) if (typeof o[key] === 'string' && o[key].startsWith('seq:')) used.add(o[key]);

  render(0);

}

  { const x = dustTex.getContext('2d'); let s = 77; for (let i = 0; i < 1400; i++) { s = (s * 1103515245 + 12345) & 0x7fffffff; const px = s % 256; s = (s * 1103515245 + 12345) & 0x7fffffff; const py = s % 256; s = (s * 1103515245 + 12345) & 0x7fffffff;

  off2 = document.createElement('canvas'); off2.width = W; off2.height = H;

// ---------- camera ----------
function camT(fr, k) { // parallax plane k: zoom 1+(z-1)k about a centre that moves k of the way
  const z = 1 + (fr.cam.z - 1) * k, [cx, cy] = fr.cam.c;

// ---------- ops ----------
function tornWipe(x, y, seed, jag) { // a torn paper edge along y, everything above it kept
  x.beginPath(); x.moveTo(-300, -300); x.lineTo(W + 300, -300);
  let s = seed * 7919 + 13;
  for (let px = W + 300; px >= -300; px -= 22) { s = (s * 1103515245 + 12345) & 0x7fffffff; x.lineTo(px, y + ((s >> 8) % 1000) / 1000 * jag - jag / 2 + Math.sin(px * 0.013 + seed) * jag * 0.4); }

function homography(src, dst) {

  for (let i = 0; i < 8; i++) { let p = i; for (let r = i + 1; r < 8; r++) if (Math.abs(A[r][i]) > Math.abs(A[p][i])) p = r; [A[i], A[p]] = [A[p], A[i]]; [b[i], b[p]] = [b[p], b[i]];

    const p = (a, b) => [a * iw / n, b * ih / n], s00 = p(i, j), s10 = p(i + 1, j), s01 = p(i, j + 1), s11 = p(i + 1, j + 1), d = s => Hm(s[0], s[1]);

    case 'rect': ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = o.a ?? 1; if (o.op) ctx.globalCompositeOperation = o.op; ctx.fillStyle = o.color; ctx.fillRect(0, 0, W, H); ctx.restore(); return;
    case 'tint': { const c = off2.getContext('2d'); c.setTransform(1, 0, 0, 1, 0, 0); c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1; c.clearRect(0, 0, W, H);
      c.fillStyle = o.color; c.fillRect(0, 0, W, H); c.globalCompositeOperation = 'destination-in'; c.drawImage(IMG[o.mask], 0, 0);
      ctx.save(); ctx.setTransform(...T); ctx.globalAlpha = o.a ?? 1; if (o.op) ctx.globalCompositeOperation = o.op; ctx.drawImage(off2, 0, 0); ctx.restore(); return; }
    case 'glow': { ctx.save(); ctx.setTransform(...T); ctx.globalCompositeOperation = o.op || 'screen'; ctx.globalAlpha = o.a ?? 1;
      ctx.translate(o.x, o.y); ctx.scale(1, (o.ry || o.r) / (o.rx || o.r)); const R = o.rx || o.r;
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, R); const [r, gg, b] = o.color; g.addColorStop(0, `rgba(${r},${gg},${b},1)`); g.addColorStop(1, `rgba(${r},${gg},${b},0)`);
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill(); ctx.restore(); return; }

    case 'line': { ctx.save(); ctx.setTransform(...T); ctx.strokeStyle = o.color; ctx.lineCap = 'round'; const j = (f >> 1) * 7.13, bo = o.boil || 0;
      for (let k = 0; k < (bo ? 2 : 1); k++) { ctx.lineWidth = o.w - k; ctx.beginPath(); o.pts.forEach(([x, y], i) => { const dx = bo ? Math.sin(j * (0.7 + i * 0.3) + k) * bo : 0, dy = bo ? Math.cos(j * (1.3 + i * 0.2) + k) * bo : 0; i ? ctx.lineTo(x + dx, y + dy) : ctx.moveTo(x + dx, y + dy); }); ctx.stroke(); }

      ctx.fillStyle = '#efe8dc'; ctx.shadowColor = 'rgba(0,0,0,.6)'; ctx.shadowBlur = 24; ctx.shadowOffsetY = 10; ctx.fillRect(-12, -12, o.w + 24, o.h + 64);
      ctx.shadowColor = 'transparent'; ctx.drawImage(im, 0, 0, o.w, o.h);
      ctx.font = "22px 'Permanent Marker', cursive"; ctx.fillStyle = '#20140c'; ctx.fillText(o.cap, 2, o.h + 30);
      ctx.font = "13px 'JetBrains Mono', monospace"; ctx.fillStyle = '#5a4634'; ctx.fillText(o.sub, 2, o.h + 48); ctx.restore(); return; }

}
function render(f) {

  const fr = CLIP.frames[f];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const [wx, wy] = noFinish ? [0, 0] : weaveOff(f);
  for (const o of fr.draw) drawOp(o, fr, f, wx, wy);
  if (showDbg) drawDebug(fr);
  ctx.setTransform(1, 0, 0, 1, 0, 0);

}
function finish(f) {
  ctx.save(); ctx.globalCompositeOperation = 'overlay'; ctx.globalAlpha = 0.16; ctx.drawImage(grain[f % 6], 0, 0, W, H); ctx.restore();
  const v = ctx.createRadialGradient(960, 540, 420, 960, 540, 1150); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(0,0,0,.55)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = 'rgba(18,10,4,.06)'; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
}
function drawDebug(fr) { // contact marks compiled into the clip (fr.dbg: [[x, y, kind], ...]) on the stage plane
  if (!fr.dbg) return; const T = camT(fr, 1); ctx.save(); ctx.setTransform(...T); ctx.lineWidth = 3;
  for (const [x, y, kind] of fr.dbg) { ctx.strokeStyle = kind === 'on' ? '#5dff8a' : kind === 'released' ? '#ffb35d' : '#ff5d5d'; ctx.beginPath(); ctx.arc(x, y, 9, 0, 7); ctx.stroke(); }
  ctx.restore();
}

// ---------- UI ----------
const COLORS = ['#7fd3c4', '#9fc6e8', '#e7a35a', '#e98f6a', '#f0c36a', '#ffd38a', '#d98bb0', '#b9c46a', '#a9a0d6', '#8fd0a0', '#e0b0f0', '#c0c8d0'];
function buildUI(P) {
  const N = CLIP.frames.length, dur = N / CLIP.clock.fps;
  $('#ptitle').textContent = CLIP.title || P.title;
  $('#about').textContent = CLIP.about;
  $('#dl-clip').href = 'weave/' + P.clip; $('#dl-mp4').href = 'weave/' + P.mp4;
  $('#tabs').innerHTML = PASSAGES.passages.map(p => `<button data-p="${p.id}" class="${p.id === PID ? 'on' : ''}" id="tab-${p.id}">${p.tab}</button>`).join('');
  $('#tabs').onclick = e => { const p = e.target.dataset.p; if (p && p !== PID) location.search = '?p=' + p; };
  $('#scrub').max = N - 1;
  const rb = $('#ribbon'); rb.innerHTML = '';
  CLIP.states.forEach((s, i) => { const d = document.createElement('div'); d.className = 'st'; d.style.left = (100 * s.t[0] / dur) + '%'; d.style.width = (100 * (s.t[1] - s.t[0]) / dur) + '%';
    d.style.background = COLORS[i % COLORS.length]; d.title = s.visible; d.textContent = s.id.replace(/^S\d+_/, ''); rb.appendChild(d); });
  for (const w of CLIP.words) { const t = w.t0 - CLIP.clock.t0; if (t < 0 || t > dur) continue; const d = document.createElement('div'); d.className = 'wd'; d.style.left = (100 * t / dur) + '%'; d.textContent = w.w; rb.appendChild(d); }
  const ph = document.createElement('div'); ph.className = 'ph'; ph.id = 'ph'; rb.appendChild(ph);
  rb.onclick = e => { const r = rb.getBoundingClientRect(); seek(Math.round((e.clientX - r.left) / r.width * (N - 1))); };
  $('#scrub').oninput = e => seek(+e.target.value);
  $('#play').onclick = () => playing ? pause() : play();
  $('#dbg').onclick = e => { showDbg = !showDbg; e.target.classList.toggle('on', showDbg); render(fIdx); };
  $('#raw').onclick = e => { noFinish = !noFinish; e.target.classList.toggle('on', noFinish); render(fIdx); };
  $('#ledger').innerHTML = CLIP.ledger.map(([k, v]) => `<div><b class="${k.split(' ').pop() === 'BELIEF' ? 'BELIEF' : k}">${k}</b><span>${v}</span></div>`).join('');
  $('#joins').innerHTML = CLIP.joins.map(([a, b]) => `<li><b>${a}</b>: ${b}</li>`).join('');
  $('#measured').innerHTML = (CLIP.measured || []).map(([a, b, ok]) => `<span>${a}</span><span class="${ok === true ? 'pass' : ok === false ? 'fail' : ''}">${b}</span>`).join('');
  drawGraph();
}
function drawGraph() {
  const g = $('#graph'), x = g.getContext('2d'), N = CLIP.frames.length; x.clearRect(0, 0, g.width, g.height);
  let lx = 8;
  for (const [key, col] of CLIP.tracks) {
    x.strokeStyle = col; x.lineWidth = 2; x.beginPath();
    CLIP.frames.forEach((fr, i) => { const v = Math.max(0, Math.min(1, fr.g[key] ?? 0)); const px = i / (N - 1) * g.width, py = g.height - 8 - v * (g.height - 16); i ? x.lineTo(px, py) : x.moveTo(px, py); }); x.stroke();
    x.font = '18px JetBrains Mono'; x.fillStyle = col; x.fillText(key, lx, 22); lx += x.measureText(key).width + 18;
  }
}
function updateUI(fr) {
  $('#tc').textContent = fr.t.toFixed(2) + ' s · clock ' + fr.clock.toFixed(2);
  $('#scrub').value = fr.f; $('#ph').style.left = (100 * fr.f / (CLIP.frames.length - 1)) + '%';
  const st = CLIP.states.find(s => fr.t >= s.t[0] && fr.t < s.t[1]) || CLIP.states[CLIP.states.length - 1];
  const word = CLIP.words.filter(w => w.t0 - CLIP.clock.t0 <= fr.t).pop();
  $('#now').innerHTML = `<em>${st.id}</em> — ${st.visible}${word ? ' · word: <em>' + word.w + '</em>' : ''}`;
  $('#state').innerHTML = [...Object.entries(fr.g).map(([k, v]) => [k, typeof v === 'number' ? v.toFixed(2) : v]), ['contact', fr.contact], ['camera', 'z ' + fr.cam.z.toFixed(2)]]
    .map(([a, b]) => `<span>${a}</span><span>${b}</span>`).join('');
}
function seek(f) { render(Math.max(0, Math.min(CLIP.frames.length - 1, f))); if (playing) audio.currentTime = fIdx / CLIP.clock.fps; }
let t0wall = 0, raf = 0;
function play() { playing = true; $('#play').textContent = '❚❚ pause'; audio.currentTime = fIdx / CLIP.clock.fps; audio.play().catch(() => {}); t0wall = performance.now() - fIdx / CLIP.clock.fps * 1000; tick(); }
function pause() { playing = false; $('#play').textContent = '▶ play'; audio.pause(); cancelAnimationFrame(raf); }
function tick() {
  if (!playing) return;
  const t = !audio.paused && audio.currentTime > 0 ? audio.currentTime : (performance.now() - t0wall) / 1000;
  const f = Math.floor(t * CLIP.clock.fps);
  if (f >= CLIP.frames.length) { pause(); render(CLIP.frames.length - 1); return; }
  if (f !== fIdx) render(Math.max(0, f));
  raf = requestAnimationFrame(tick);
}
window.renderFrame = f => { render(f); return true; };
window.frameJPEG = (f, qual = 0.92) => { render(f); return cv.toDataURL('image/jpeg', qual); };
boot().then(() => {
  if (q.get('f')) render(+q.get('f'));
  if (q.get('selftest')) selftest();
}).catch(e => { document.body.insertAdjacentHTML('afterbegin', `<pre style="color:#ff7b6b;padding:12px">boot failed: ${e.message}</pre>`); console.error(e); });

function selftest() {
  const out = $('#selftest'); out.style.display = 'block'; const L = [];
  const ok = (c, m) => L.push((c ? 'PASS ' : 'FAIL ') + m);
  ok(CLIP.frames.length === CLIP.clock.frames, 'frame count matches clock');
  const missing = new Set(); for (const fr of CLIP.frames) for (const o of fr.draw) { if (o.id && !IMG[o.id]) missing.add(o.id); if (o.mask && !IMG[o.mask]) missing.add(o.mask); }
  ok(missing.size === 0, 'every image a display list names is loaded' + (missing.size ? ': missing ' + [...missing].join(',') : ''));
  const a = cv.toDataURL('image/png'); ok(a.length > 1000, 'canvas draws');
  const mid = Math.floor(CLIP.frames.length / 2);
  render(10); const r1 = cv.toDataURL(); render(mid); render(10); const r2 = cv.toDataURL(); ok(r1 === r2, `frame 10 renders the same after frame ${mid} (deterministic)`);
  for (const [name, val, pass] of (CLIP.measured || [])) if (pass === true || pass === false) ok(pass, name + ': ' + val);
  out.textContent = PID + '\n' + L.join('\n') + '\nDONE';
}
</script>
