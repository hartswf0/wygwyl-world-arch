<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
<defs><style>text{font-family:Arial,sans-serif;fill:#17252c}.h{font-size:36px;font-weight:700}.s{font-size:20px}.m{font-size:24px;font-weight:700}.l{font-size:19px}.p{fill:#e9b95b;stroke:#624b2d;stroke-width:3}.link{stroke:#70838d;stroke-width:3;stroke-dasharray:8 6;fill:none}.card{stroke:#294754;stroke-width:4;fill:#d4e6ed}</style></defs>
<rect width="1600" height="1100" fill="#fbfaf6"/>
<text x="56" y="62" class="h">PUPPET ASSEMBLY • TORSO, HIPS &amp; INDEPENDENT LIMBS</text>
<text x="56" y="100" class="s">Connection guide for every poem kit. The artwork supplies the character; this diagram supplies the joint relationships.</text>
<line x1="850" y1="140" x2="850" y2="1020" stroke="#cbd3d5" stroke-width="2"/>
<text x="58" y="160" class="m">1. CONNECT THE PARTS</text>
<ellipse cx="444" cy="223" rx="52" ry="59" class="card"/>
<rect x="431" y="271" width="26" height="32" rx="8" class="card"/>
<circle cx="444" cy="286" r="9" class="p"/>
<path d="M444 303V335" class="link"/>
<path d="M386 331L417 341Q444 359 471 341L502 331L511 355Q486 372 500 402L505 474L383 474L388 402Q402 372 377 355Z" class="card"/>
<circle cx="444" cy="351" r="9" class="p"/><circle cx="386" cy="351" r="9" class="p"/><circle cx="502" cy="351" r="9" class="p"/><circle cx="444" cy="457" r="9" class="p"/>
<text x="425" y="418" class="m">TORSO</text><text x="527" y="357" class="l">Shoulder</text><text x="527" y="464" class="l">W: waist</text>
<path d="M444 474V533" class="link"/>
<path d="M431 533Q444 517 457 533L510 599Q520 621 493 623H395Q368 621 378 599Z" class="card"/>
<circle cx="444" cy="548" r="9" class="p"/><circle cx="395" cy="605" r="9" class="p"/><circle cx="493" cy="605" r="9" class="p"/>
<text x="550" y="562" class="m">HIP BRIDGE</text><text x="550" y="592" class="l">W above both thigh pivots</text><text x="550" y="619" class="l">Match the chosen body view</text>
<path d="M395 623V663M493 623V663" class="link"/>
<rect x="371" y="658" width="48" height="135" rx="23" class="card"/><rect x="469" y="658" width="48" height="135" rx="23" class="card"/>
<circle cx="395" cy="677" r="9" class="p"/><circle cx="395" cy="775" r="9" class="p"/><circle cx="493" cy="677" r="9" class="p"/><circle cx="493" cy="775" r="9" class="p"/>
<text x="553" y="727" class="m">THIGHS</text><text x="553" y="755" class="l">One segment each</text>
<path d="M395 793V827M493 793V827" class="link"/>
<rect x="375" y="824" width="40" height="118" rx="20" class="card"/><rect x="473" y="824" width="40" height="118" rx="20" class="card"/>
<circle cx="395" cy="842" r="9" class="p"/><circle cx="395" cy="925" r="9" class="p"/><circle cx="493" cy="842" r="9" class="p"/><circle cx="493" cy="925" r="9" class="p"/>
<text x="553" y="869" class="m">SHINS</text><text x="553" y="897" class="l">Knee to ankle</text>
<path d="M395 942V974M493 942V974" class="link"/>
<path d="M374 970H410V1011H344Q329 990 374 987Z" class="card"/><path d="M478 970H514V987Q559 990 544 1011H478Z" class="card"/>
<circle cx="393" cy="989" r="9" class="p"/><circle cx="495" cy="989" r="9" class="p"/>
<text x="553" y="996" class="m">SEPARATE FEET</text>
<path d="M377 351H286" class="link"/>
<rect x="236" y="326" width="48" height="128" rx="24" class="card"/>
<circle cx="260" cy="346" r="9" class="p"/><circle cx="260" cy="434" r="9" class="p"/>
<path d="M260 454V490" class="link"/>
<rect x="240" y="488" width="40" height="117" rx="20" class="card"/>
<circle cx="260" cy="508" r="9" class="p"/><circle cx="260" cy="587" r="9" class="p"/>
<path d="M260 605V644" class="link"/>
<path d="M248 639H272V659L288 682Q285 699 274 683V721Q268 728 264 717Q256 731 251 718Q241 724 240 710L238 674Z" class="card"/>
<circle cx="260" cy="651" r="9" class="p"/>
<text x="58" y="381" class="m">UPPER ARM</text><text x="58" y="411" class="l">Shoulder → elbow</text><text x="58" y="539" class="m">FOREARM</text><text x="58" y="569" class="l">Elbow → wrist</text><text x="58" y="681" class="m">HAND</text><text x="58" y="711" class="l">Gesture card</text>
<text x="66" y="808" class="l">The other arm uses</text><text x="66" y="834" class="l">the same branch.</text><text x="66" y="883" class="l">Remove or swap a branch</text><text x="66" y="909" class="l">at its shoulder pivot.</text>
<text x="901" y="160" class="m">2. ADD THE CLOTHING COVERS</text>
<path d="M951 221Q1026 198 1101 221L1118 277Q1080 321 1026 292Q972 321 934 277Z" fill="#dfbfa2" stroke="#6b4f3e" stroke-width="4"/>
<text x="1150" y="242" class="m">REAR SEAT / BUTT</text><text x="1150" y="272" class="l">Clothed cover over the pelvis</text><text x="1150" y="300" class="l">Use profile, back or front view</text>
<text x="920" y="362" class="s">The hip bridge carries the leg joints. The rear seat supplies</text><text x="920" y="391" class="s">the clothed silhouette for standing, sitting and rear views.</text>
<path d="M953 444H1078L1127 591Q1020 617 910 591Z" fill="#c9d8c6" stroke="#4c664d" stroke-width="4"/>
<circle cx="1016" cy="462" r="9" class="p"/>
<text x="1150" y="482" class="m">SKIRT / ROBE PANEL</text><text x="1150" y="513" class="l">Separate from the bodice</text><text x="1150" y="541" class="l">Separate from thighs and shins</text><text x="1150" y="569" class="l">Swings at the waist</text>
<text x="901" y="673" class="m">3. MATCH THE COSTUME</text>
<text x="920" y="719" class="s">Tracksuit / trousers</text><text x="1220" y="719" class="s">Hip bridge + clothed seat</text>
<text x="920" y="761" class="s">Shorts / pajamas</text><text x="1220" y="761" class="s">Hip bridge + shorts/seat cover</text>
<text x="920" y="803" class="s">Dress / gown / robe</text><text x="1220" y="803" class="s">Hip bridge + seat + skirt panels</text>
<text x="920" y="845" class="s">Jacket / long coat</text><text x="1220" y="845" class="s">Separate hem or coat-tail layer</text>
<rect x="900" y="902" width="646" height="122" rx="12" fill="#eef0e9"/>
<text x="921" y="936" class="l">Head, facial features, glasses and held props are independent.</text><text x="921" y="967" class="l">Arrange front/back layer order for the chosen pose.</text><text x="921" y="998" class="l">Calibrate crop scale and pivot positions before animation.</text>
<text x="56" y="1067" class="s">Schematic only • Generated kit sheets are labeled raster artwork; parts require extraction and alignment.</text>
</svg>
