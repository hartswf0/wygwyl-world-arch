<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skin Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b0a;--panel:#16120f;--line:#2a221c;--ink:#efe6da;--dim:#9a8d7e;--card:#c79a62;--acc:#e7a35a;--sel:#5fd0ff;--ok:#8fd16a;--warn:#e7c35a;--bad:#ef6a5a;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,sans-serif}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line)}
h1{font:400 24px 'Permanent Marker',cursive;margin:0 8px 0 0}
h1 span{color:var(--acc)}
.btn,select,input[type=search]{font:12px var(--mono);color:var(--dim);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
input[type=search]{cursor:text;border-radius:6px;width:100%}
select option{background:var(--panel)}
.btn:hover{color:var(--card);border-color:var(--card)}
.btn.on{color:#1a120a;background:var(--card);border-color:var(--card)}
.sub{color:var(--dim);font-size:12px}
main{display:grid;grid-template-columns:260px 1fr 360px;height:calc(100% - 50px)}
aside{border-right:1px solid var(--line);overflow:auto;padding:10px}
#right{border-right:0;border-left:1px solid var(--line)}
.trial{padding:5px 7px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.trial:hover{border-color:var(--line)}
.trial.on{border-color:var(--card);background:#211a14}
.trial b{font:600 11px var(--mono);color:var(--acc);margin-right:6px}
.trial small{display:block;color:var(--dim);font-size:11px}
#mid{display:flex;flex-direction:column;min-width:0;position:relative}
#cv{flex:1;width:100%;min-height:0;display:block;cursor:crosshair;background:radial-gradient(ellipse at 50% 30%,#1c1712,#0d0b0a 70%)}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;border-top:1px solid var(--line)}
.bar input[type=range]{flex:1;min-width:120px;accent-color:var(--card)}
#note{padding:6px 10px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);max-height:60px;overflow:auto}
h2{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
.bones{display:flex;flex-wrap:wrap;gap:4px}
.bones .btn{padding:2px 7px;font-size:11px}
.bones .btn.skinned{border-color:var(--ok);color:var(--ok)}
.bones .btn.on{color:#0d0b0a;background:var(--sel);border-color:var(--sel)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.cand{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:#efe6da10 center/contain no-repeat;cursor:pointer}
.cand:hover{border-color:var(--card)}
.cand.on{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.cand i{position:absolute;left:2px;bottom:1px;font:600 9px var(--mono);font-style:normal;padding:0 3px;border-radius:3px;background:#0d0b0acc}
.r-ok{color:var(--ok)}.r-warn{color:var(--warn)}.r-bad{color:var(--bad)}
.row{display:flex;gap:6px;align-items:center;margin:4px 0}
.row label{width:74px;color:var(--dim);font:11px var(--mono)}
.row input[type=range]{flex:1;accent-color:var(--card)}
.row output{width:52px;text-align:right;font:11px var(--mono)}
#pe{width:100%;height:220px;background:#efe6da14;border-radius:8px;display:block;cursor:grab}
.checks div{font:11px var(--mono);margin:2px 0}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px}
.filters select{border-radius:6px;width:100%}
#cardinfo{font:11px var(--mono);color:var(--dim);word-break:break-all}
kbd{font:10px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 3px;color:var(--dim)}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vt{border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;text-align:center;font:11px var(--mono);color:var(--dim)}
.vt div{aspect-ratio:1;background:#efe6da10 center/contain no-repeat;border-radius:5px;margin-bottom:3px;display:grid;place-items:center;color:#5a4e44}
.vt.on{border-color:var(--sel);color:var(--sel)}
.vt.now b{color:var(--ok)}
#score{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:11px var(--mono);color:var(--dim)}
#score .btn small{opacity:.75}
#menu{position:absolute;inset:0;pointer-events:none;display:none}
#menu.on{display:block}
#menu button{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;font:11px var(--mono);color:var(--ink);background:#16120fee;border:1px solid var(--card);border-radius:999px;padding:4px 9px;cursor:pointer;white-space:nowrap}
#menu button:hover{background:var(--card);color:#1a120a}
#menu i{position:absolute;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:var(--sel)}
details{border:1px solid var(--line);border-radius:8px;padding:6px 8px;margin:0 0 8px}
summary{cursor:pointer;font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
#vit{width:100%;height:250px;display:block;cursor:grab;margin-top:6px}
#bChart{width:100%;height:46px;display:block}
.lay{display:flex;align-items:center;gap:6px;padding:2px 4px;border:1px solid transparent;border-radius:6px;font:11px var(--mono);color:var(--dim);cursor:grab;user-select:none}
.lay span{width:26px;height:26px;background:#efe6da10 center/contain no-repeat;border-radius:4px;flex:none}
.lay.on{border-color:var(--sel);color:var(--sel)}
.lay.over{border-top:2px solid var(--acc)}
.top{display:flex;gap:6px;align-items:center;font:11px var(--mono);padding:2px 0;cursor:pointer}
.top:hover{color:var(--card)}
.top .strip{display:flex;gap:1px}
.top .strip span{width:16px;height:16px;background:center/contain no-repeat}
.tips{font:10.5px var(--mono);color:var(--dim);margin:4px 0}
#cov{width:100%;height:190px;display:block;cursor:pointer}
.sty{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;background:none;padding:2px 8px 2px 4px;cursor:pointer;color:var(--dim);font:11px var(--mono)}
.sty.on{border-color:var(--card);color:var(--ink)}
.sty svg{width:22px;height:42px}
.mbar{width:64px;height:6px;background:#2a221c;border-radius:3px;overflow:hidden;display:inline-block}
.mbar i{display:block;height:100%}
.meter{display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--dim);margin:3px 0}
.meter span{min-width:16px;text-align:center;color:var(--ink)}
.trk{position:relative;flex:1;height:8px;background:#2a221c;border-radius:4px}
.trk i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.trk b{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
.meter em{font-style:normal;width:56px;text-align:right}
.src{display:inline-block;font:10px var(--mono);padding:0 5px;border-radius:3px;margin-left:4px}
.src.kit{background:#8fd16a33;color:var(--ok)}.src.bashed{background:#e7c35a33;color:var(--warn)}.src.built{background:#5fd0ff33;color:var(--sel)}
</style>
</head>
<body>
<header>
  <h1>Skin <span>Lab</span></h1>
  <span style="flex:1"></span>
  <select id="style" title="rig style: which cards the figure is cut into"></select>
  <button class="btn on" id="solveB" title="puppet: rigid cards pinned at their brads, solved to reach the pose (IK). pinned: every card stretched onto its own bone">puppet · IK</button>
  <button class="btn" id="bind" title="read where each child joint sits on its parent card at this frame">bind here</button>
  <select id="actor" title="actor"></select>
  <select id="dress" title="dress every limb, every view, from one character"><option value="">auto-dress…</option></select>
  <button class="btn" id="gridB" title="a grid of bodies or faces to watch, rate and evolve: click ♥, right-click ✕, shift-click a misfiled piece, alt-click to flip its facing, double-click to use">▦ grid</button>
  <select id="file" title="save, load, export"><option value="">file…</option><option value="save">save skin…</option><option value="export">export JSON</option><option value="labels">export labels</option><option value="clear">clear skin</option></select>
</header>
<main>
  <aside id="left">
    <input type="search" id="tq" placeholder="search 191 trials…">
    <div id="trials" style="margin-top:6px"></div>
  </aside>
  <section id="mid">
    <canvas id="cv"></canvas>
    <div id="menu"></div>
    <div class="bar">
      <button class="btn" id="play">▶</button>
      <input type="range" id="scrub" min="0" max="0" value="0">
      <span class="sub" id="fr" style="font-family:var(--mono);width:70px">0/0</span>
      <select id="speed"><option value=".25">¼×</option><option value=".5">½×</option><option value="1" selected>1×</option></select>
    </div>
    <div class="bar">
      <button class="btn" data-view="cam">trial cam</button>
      <button class="btn" data-view="front">front</button>
      <button class="btn" data-view="side">side</button>
      <button class="btn" data-view="split">side + front</button>
      <span class="sub">yaw</span><input type="range" id="yaw" min="-180" max="180" value="-22">
      <button class="btn on" id="isolate" title="dim every other card">isolate</button>
      <button class="btn on" id="bonesT">skeleton</button>
      <button class="btn on" id="follow">follow</button>
    </div>
    <div class="bar" id="score"></div>
    <div id="note"></div>
  </section>
  <aside id="right">
    <details id="propD"><summary>proportions</summary>
      <div class="row"><select id="preset" title="the skeleton's proportions">
        <option value="bolas">as recorded (Bolas)</option><option value="vitruvian">Vitruvian canon</option><option value="cards">to the dressed cards</option><option value="custom">custom</option></select>
        <span class="sub" id="propInfo"></span></div>
      <canvas id="vit"></canvas>
      <div class="checks" id="bars"></div>
    </details>
    <details id="breedD"><summary>breed</summary>
      <div class="filters" style="margin-top:6px">
        <select id="bTarget"><option value="trial">whole trial</option><option value="frame">this pose (±6 frames)</option></select>
        <select id="bFrom"><option value="">from any character</option></select>
        <label class="sub" style="grid-column:1/3"><input type="checkbox" id="bStyle" checked> breed the skeleton style too</label>
      </div>
      <div class="row"><button class="btn" id="bRun">breed</button><span class="sub" id="bInfo"></span></div>
      <canvas id="bChart"></canvas>
      <div id="bTop"></div>
    </details>
    <canvas id="cov" title="every limb in every view — green: from the kit · amber: borrowed from another kit · blue: built by code · dashed: missing. Click one."></canvas>
    <div id="sel" style="display:none">
      <div class="views" id="views"></div>
    </div>
    <h2 title="top is in front; drag to restack, or [ and ] on the stage">layers</h2>
    <div id="layers"></div>
    <div id="sel2" style="display:none">
      <h2 title="drag A (parent joint) and B (child joint); rings are the card's brads">attach</h2>
      <canvas id="pe"></canvas>
      <div id="cardinfo"></div>
      <div class="checks" id="checks"></div>
      <h2>library</h2>
      <div class="filters">
        <select id="fChar"><option value="">any character</option></select>
        <select id="fView"><option value="@">cards for this view</option><option value="">any view</option></select>
        <select id="fSide"><option value="">any side</option><option>L</option><option>R</option></select>
        <select id="fSort"><option value="ratio">closest length</option><option value="q">grade</option><option value="char">character</option></select>
        <label class="sub" style="grid-column:1/3" title="hide cards whose file name or pixels say they are something else"><input type="checkbox" id="fName" checked> hide misfiled <span id="nbad"></span></label>
      </div>
      <input type="search" id="fq" placeholder="label contains…">
      <div class="sub" id="ncand" style="margin:4px 0"></div>
      <div class="grid" id="cands"></div>
    </div>
  </aside>
</main>
<script src="../../nav.js" defer></script>
<script>
'use strict';
// ---------- the Bolas skeleton (26 joints, cm, y up, floor y=0) plus four points of our own ----------
const J = 'pelvis hipL hipR kneeL kneeR ankleL ankleR heelL heelR ballL ballR toeL toeR spineMid neckBase chest shoulderL shoulderR elbowL elbowR wristL wristR headBase head headTop nose'.split(' ');
const ji = Object.fromEntries(J.map((n, i) => [n, i]));
Object.assign(ji, { tipL: 26, tipR: 27, waist: 28, crotch: 29 });
const HAND_CM = 18.5;

// ---------- proportions: the skeleton is retargeted bone by bone (FK from the pelvis), then put back on the floor ----------
const TOPO = ['hipL','hipR','kneeL','kneeR','ankleL','ankleR','heelL','heelR','ballL','ballR','toeL','toeR','spineMid','chest','neckBase','shoulderL','shoulderR','elbowL','elbowR','wristL','wristR','headBase','head','headTop','nose'];
const PAR = { hipL:'pelvis', hipR:'pelvis', kneeL:'hipL', kneeR:'hipR', ankleL:'kneeL', ankleR:'kneeR', heelL:'ankleL', heelR:'ankleR', ballL:'ankleL', ballR:'ankleR', toeL:'ballL', toeR:'ballR',
  spineMid:'pelvis', chest:'spineMid', neckBase:'chest', shoulderL:'neckBase', shoulderR:'neckBase', elbowL:'shoulderL', elbowR:'shoulderR', wristL:'elbowL', wristR:'elbowR', headBase:'neckBase', head:'headBase', headTop:'head', nose:'head' };
const GRP = { hipL:'hips', hipR:'hips', kneeL:'thigh', kneeR:'thigh', ankleL:'shin', ankleR:'shin', heelL:'foot', heelR:'foot', ballL:'foot', ballR:'foot', toeL:'foot', toeR:'foot',
  spineMid:'torso', chest:'torso', neckBase:'torso', shoulderL:'shoulders', shoulderR:'shoulders', elbowL:'upper_arm', elbowR:'upper_arm', wristL:'forearm', wristR:'forearm', headBase:'head', head:'head', headTop:'head', nose:'head' };
const GROUPS = ['head', 'torso', 'shoulders', 'hips', 'upper_arm', 'forearm', 'hand', 'thigh', 'shin', 'foot'];
// Leonardo's Vitruvian man, as fractions of the height: top of the chest to the crown 1/6; elbow to fingertip (cubit) 1/4,
// of which the hand 1/10; elbow to armpit 1/8 (+ the shoulder head); groin to below the knee 1/4; below the knee to the sole 1/4;
// the foot 1/7; the widest shoulders 1/4 (joint to joint about 4/5 of that)
const VIT = { head: 1 / 6, torso: .31, shoulders: .2, hips: .11, upper_arm: .165, forearm: .15, hand: .1, thigh: .25, shin: .23, foot: 1 / 7 };
const FEET = ['ankleL','ankleR','heelL','heelR','ballL','ballR','toeL','toeR'].map(n => ji[n]);
function measure(j) {
  const d = (a, b) => len3(v3(j[ji[a]], j[ji[b]])), av = (a, b) => (d(a + 'L', b + 'L') + d(a + 'R', b + 'R')) / 2;
  return { head: d('neckBase', 'headTop'), torso: d('pelvis', 'spineMid') + d('spineMid', 'chest') + d('chest', 'neckBase'), shoulders: d('shoulderL', 'shoulderR'),
    hips: d('hipL', 'hipR'), upper_arm: av('shoulder', 'elbow'), forearm: av('elbow', 'wrist'), hand: HAND_CM, thigh: av('hip', 'knee'), shin: av('knee', 'ankle'), foot: av('heel', 'toe') };
}
function retarget(raw, K) {
  const out = []; out[0] = raw[0].slice();
  for (const n of TOPO) { const i = ji[n], p = ji[PAR[n]], k = K[GRP[n]] ?? 1; out[i] = [0, 1, 2].map(a => out[p][a] + (raw[i][a] - raw[p][a]) * k); }
  const lo = Math.min(...FEET.map(i => raw[i][1])), ln = Math.min(...FEET.map(i => out[i][1]));
  for (const q of out) q[1] += lo - ln;
  return out;
}
const JC = new WeakMap();
function joints(fr, id) {
  let c = JC.get(fr); if (!c || c.v !== S.pv) { c = { v: S.pv }; JC.set(fr, c); }
  if (c[id]) return c[id];
  const a = fr.a[id]; if (!a) return null;
  const K = id === S.actor ? S.K : {};
  const j = Object.keys(K).length ? retarget(a.j, K) : a.j.map(q => q.slice());
  for (const s of ['L', 'R']) {              // fingertip: the forearm carried on by a hand length
    const e = j[ji['elbow' + s]], w = j[ji['wrist' + s]], d = v3(e, w), l = len3(d) || 1, h = HAND_CM * (K.hand ?? 1);
    j.push([w[0] + d[0] / l * h, w[1] + d[1] / l * h, w[2] + d[2] / l * h]);
  }
  const p = j[0], u = v3(p, j[ji.spineMid]), l = len3(u) || 1;   // waist above the pelvis joint, crotch below: the hip bridge's span
  j.push([p[0] + u[0] / l * 7, p[1] + u[1] / l * 7, p[2] + u[2] / l * 7], [p[0] - u[0] / l * 13, p[1] - u[1] / l * 13, p[2] - u[2] / l * 13]);
  return c[id] = j;
}

// ---------- segments and rig styles ----------
const SEG = {
  pelvis: { slots: ['pelvis'], from: 'waist', to: 'crotch', par: [], face: 'pfwd', g: 'hips' },
  torso: { slots: ['torso'], from: 'waist', to: 'neckBase', par: ['pelvis'], face: 'fwd', g: 'torso' },
  head: { slots: ['head'], from: 'neckBase', to: 'headTop', par: ['torso'], face: 'hfwd', g: 'head' },
};
for (const s of ['L', 'R']) Object.assign(SEG, {
  ['upper_arm_' + s]: { slots: ['upper_arm'], from: 'shoulder' + s, to: 'elbow' + s, par: ['torso'], face: 'fwd', g: 'upper_arm' },
  ['forearm_' + s]: { slots: ['forearm'], from: 'elbow' + s, to: 'wrist' + s, par: ['upper_arm_' + s], face: 'fwd', ik: 'upper_arm_' + s, g: 'forearm' },
  ['mitt_' + s]: { slots: ['forearm', 'hand'], from: 'elbow' + s, to: 'tip' + s, par: ['upper_arm_' + s], face: 'fwd', ik: 'upper_arm_' + s, g: 'forearm' },
  ['arm_' + s]: { slots: ['upper_arm', 'forearm'], from: 'shoulder' + s, to: 'wrist' + s, par: ['torso'], face: 'fwd', g: 'upper_arm' },
  ['hand_' + s]: { slots: ['hand'], from: 'wrist' + s, to: 'tip' + s, par: ['forearm_' + s, 'arm_' + s], face: 'fwd', g: 'hand' },
  ['thigh_' + s]: { slots: ['thigh'], from: 'hip' + s, to: 'knee' + s, par: ['pelvis', 'torso'], face: 'pfwd', g: 'thigh' },
  ['shin_' + s]: { slots: ['shin'], from: 'knee' + s, to: 'ankle' + s, par: ['thigh_' + s], face: 'pfwd', ik: 'thigh_' + s, g: 'shin' },
  ['leg_' + s]: { slots: ['thigh', 'shin'], from: 'hip' + s, to: 'ankle' + s, par: ['pelvis', 'torso'], face: 'pfwd', g: 'thigh' },
  ['foot_' + s]: { slots: ['foot'], from: 'ankle' + s, to: 'toe' + s, par: ['shin_' + s, 'leg_' + s], face: 'pfwd', g: 'foot' },
});
const LR = (...n) => n.flatMap(x => [x + '_L', x + '_R']);
const STYLES = {
  classic: { label: '14 cards', segs: ['torso', 'head', ...LR('upper_arm', 'forearm', 'hand', 'thigh', 'shin', 'foot')] },
  hips: { label: '15 · hip bridge', segs: ['pelvis', 'torso', 'head', ...LR('upper_arm', 'forearm', 'hand', 'thigh', 'shin', 'foot')] },
  mitt: { label: '13 · hip bridge + mitts', segs: ['pelvis', 'torso', 'head', ...LR('upper_arm', 'mitt', 'thigh', 'shin', 'foot')] },
  long: { label: '10 · long limbs', segs: ['torso', 'head', ...LR('arm', 'hand', 'leg', 'foot')] },
};
// draw order, back to front, by role: the limb nearer the camera is "near"; a child sits on its parent (shoe over calf)
const STACK0 = ['far_upper_arm', 'far_arm', 'far_forearm', 'far_mitt', 'far_hand', 'far_thigh', 'far_leg', 'far_shin', 'far_foot', 'near_thigh', 'near_leg', 'pelvis',
  'near_shin', 'near_foot', 'torso', 'head', 'near_upper_arm', 'near_arm', 'near_forearm', 'near_mitt', 'near_hand'];
const ARMS = /^(upper_arm|forearm|mitt|arm|hand)$/;
const VIEWS = ['side', 'front', 'back'];
const VIEWOF = v => v === 'profile' || v === 'side' ? 'side' : v === 'front' || v === 'threequarter' ? 'front' : v === 'back' || v === 'threequarter_back' ? 'back' : null;
const viewOf = c => VIEWOF(S.fix[c.id]?.view || c.human?.view || c.view || (c.clip?.view_l_p > .8 && c.clip.view_l) || c.est_view) || 'side';   // a person, the label, CLIP (learnt), the pixels
const OTHER = k => k.endsWith('_L') ? k.slice(0, -1) + 'R' : k.endsWith('_R') ? k.slice(0, -1) + 'L' : null;
const STICK = [['pelvis','spineMid'],['spineMid','chest'],['chest','neckBase'],['neckBase','headBase'],['headBase','headTop'],['head','nose'],
  ['neckBase','shoulderL'],['neckBase','shoulderR'],['shoulderL','elbowL'],['elbowL','wristL'],['shoulderR','elbowR'],['elbowR','wristR'],
  ['pelvis','hipL'],['pelvis','hipR'],['hipL','kneeL'],['kneeL','ankleL'],['ankleL','heelL'],['heelL','ballL'],['ballL','toeL'],['ankleL','ballL'],
  ['hipR','kneeR'],['kneeR','ankleR'],['ankleR','heelR'],['heelR','ballR'],['ballR','toeR'],['ankleR','ballR']];
// does the card's file name agree with the slot it was filed under? (the sheet labels are often wrong)
const NAME = { upper_arm: /upper|uarm|bicep|arm-a\b|^arm/, forearm: /fore|farm/, hand: /hand|palm|fist|grip|point|pinch|relax|open|thumb|wave|cup|claw/,
  thigh: /thigh/, shin: /shin|calf|leg-lower|lower-leg/, foot: /foot|shoe|boot|sneak|heel|toe/, head: /head|profile|face|front|threequarter|back/,
  torso: /torso|chest|body|jacket|shirt|vest|bodice/, pelvis: /hip|pelvis|waist/ };

// fill the gaps: the torso and hips are built by code; any other missing limb or view is borrowed from the kit
