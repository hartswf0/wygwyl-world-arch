<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skin Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d0b0a;--panel:#16120f;--line:#2a221c;--ink:#efe6da;--dim:#9a8d7e;--card:#c79a62;--acc:#e7a35a;--sel:#5fd0ff;--ok:#8fd16a;--warn:#e7c35a;--bad:#ef6a5a;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.45 Inter,system-ui,sans-serif}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:8px 14px;border-bottom:1px solid var(--line)}
h1{font:400 24px 'Permanent Marker',cursive;margin:0 8px 0 0}
h1 span{color:var(--acc)}
.btn,select,input[type=search]{font:12px var(--mono);color:var(--dim);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
input[type=search]{cursor:text;border-radius:6px;width:100%}
select option{background:var(--panel)}
.btn:hover{color:var(--card);border-color:var(--card)}
.btn.on{color:#1a120a;background:var(--card);border-color:var(--card)}
.sub{color:var(--dim);font-size:12px}
main{display:grid;grid-template-columns:260px 1fr 360px;height:calc(100% - 50px)}
aside{border-right:1px solid var(--line);overflow:auto;padding:10px}
#right{border-right:0;border-left:1px solid var(--line)}
.trial{padding:5px 7px;border-radius:6px;cursor:pointer;border:1px solid transparent}
.trial:hover{border-color:var(--line)}
.trial.on{border-color:var(--card);background:#211a14}
.trial b{font:600 11px var(--mono);color:var(--acc);margin-right:6px}
.trial small{display:block;color:var(--dim);font-size:11px}
#mid{display:flex;flex-direction:column;min-width:0}
#cv{flex:1;width:100%;min-height:0;display:block;cursor:crosshair;background:radial-gradient(ellipse at 50% 30%,#1c1712,#0d0b0a 70%)}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:6px 10px;border-top:1px solid var(--line)}
.bar input[type=range]{flex:1;min-width:120px;accent-color:var(--card)}
#note{padding:6px 10px;color:var(--dim);font-size:12px;border-top:1px solid var(--line);max-height:60px;overflow:auto}
h2{font:600 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);margin:12px 0 6px}
.bones{display:flex;flex-wrap:wrap;gap:4px}
.bones .btn{padding:2px 7px;font-size:11px}
.bones .btn.skinned{border-color:var(--ok);color:var(--ok)}
.bones .btn.on{color:#0d0b0a;background:var(--sel);border-color:var(--sel)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.cand{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:6px;background:#efe6da10 center/contain no-repeat;cursor:pointer}
.cand:hover{border-color:var(--card)}
.cand.on{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.cand i{position:absolute;left:2px;bottom:1px;font:600 9px var(--mono);font-style:normal;padding:0 3px;border-radius:3px;background:#0d0b0acc}
.r-ok{color:var(--ok)}.r-warn{color:var(--warn)}.r-bad{color:var(--bad)}
.row{display:flex;gap:6px;align-items:center;margin:4px 0}
.row label{width:74px;color:var(--dim);font:11px var(--mono)}
.row input[type=range]{flex:1;accent-color:var(--card)}
.row output{width:52px;text-align:right;font:11px var(--mono)}
#pe{width:100%;height:220px;background:#efe6da14;border-radius:8px;display:block;cursor:grab}
.checks div{font:11px var(--mono);margin:2px 0}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:6px}
.filters select{border-radius:6px;width:100%}
#cardinfo{font:11px var(--mono);color:var(--dim);word-break:break-all}
kbd{font:10px var(--mono);border:1px solid var(--line);border-radius:3px;padding:0 3px;color:var(--dim)}
.views{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.vt{border:1px solid var(--line);border-radius:8px;padding:4px;cursor:pointer;text-align:center;font:11px var(--mono);color:var(--dim)}
.vt div{aspect-ratio:1;background:#efe6da10 center/contain no-repeat;border-radius:5px;margin-bottom:3px;display:grid;place-items:center;color:#5a4e44}
.vt.on{border-color:var(--sel);color:var(--sel)}
.vt.now b{color:var(--ok)}
#score{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font:11px var(--mono);color:var(--dim)}
#score .btn small{opacity:.75}
</style>
</head>
<body>
<header>
  <h1>Skin <span>Lab</span></h1>
  <span class="sub">Pick a Crash Lab trial, click a limb, dress it from the kits, watch the puppet move.</span>
  <span style="flex:1"></span>
  <select id="style" title="rig style: which cards the figure is cut into"></select>
  <button class="btn on" id="solveB" title="puppet: rigid cards pinned at their brads, solved to reach the pose (IK). pinned: every card stretched onto its own bone">puppet · IK</button>
  <button class="btn" id="bind" title="read where each child joint sits on its parent card at this frame">bind here</button>
  <select id="actor" title="actor"></select>
  <select id="dress" title="dress every limb, every view, from one character"><option value="">auto-dress…</option></select>
  <button class="btn" id="clear">clear</button>
  <button class="btn" id="save">save</button>
  <select id="load"><option value="">load…</option></select>
  <button class="btn" id="export">export</button>
</header>
<main>
  <aside id="left">
    <input type="search" id="tq" placeholder="search 191 trials…">
    <div id="trials" style="margin-top:6px"></div>
  </aside>
  <section id="mid">
    <canvas id="cv"></canvas>
    <div class="bar">
      <button class="btn" id="play">▶</button>
      <input type="range" id="scrub" min="0" max="0" value="0">
      <span class="sub" id="fr" style="font-family:var(--mono);width:70px">0/0</span>
      <select id="speed"><option value=".25">¼×</option><option value=".5">½×</option><option value="1" selected>1×</option></select>
    </div>
    <div class="bar">
      <button class="btn" data-view="cam">trial cam</button>
      <button class="btn" data-view="front">front</button>
      <button class="btn" data-view="side">side</button>
      <button class="btn" data-view="split">side + front</button>
      <span class="sub">yaw</span><input type="range" id="yaw" min="-180" max="180" value="-22">
      <button class="btn on" id="isolate" title="dim every other card">isolate</button>
      <button class="btn on" id="bonesT">skeleton</button>
      <button class="btn on" id="follow">follow</button>
    </div>
    <div class="bar" id="score"></div>
    <div id="note"></div>
  </section>
  <aside id="right">
    <h2>Limb <span class="sub" style="text-transform:none;letter-spacing:0">— click one on the stage</span></h2>
    <div class="bones" id="bones"></div>
    <div id="sel" style="display:none">
      <h2>Cards by view <span class="sub" style="text-transform:none;letter-spacing:0">— swapped as the body turns</span></h2>
      <div class="views" id="views"></div>
      <h2>Fit</h2>
      <div class="row"><button class="btn" id="mFit">fit to bone</button><button class="btn" id="mTrue">true scale</button><button class="btn" id="mirror">mirror</button><button class="btn" id="faceL" title="this profile card is drawn facing left">drawn facing left</button></div>
      <div class="row"><label>scale</label><input type="range" id="kS" min="40" max="250" value="100"><output id="oS"></output></div>
      <div class="row"><label>rotate</label><input type="range" id="kR" min="-180" max="180" value="0"><output id="oR"></output></div>
      <div class="row"><label>slide</label><input type="range" id="kX" min="-50" max="50" value="0"><output id="oX"></output></div>
      <div class="row"><label>push</label><input type="range" id="kY" min="-50" max="50" value="0"><output id="oY"></output></div>
      <div class="row"><label>layer</label><input type="range" id="kZ" min="-3" max="3" value="0"><output id="oZ"></output></div>
      <div class="row"><button class="btn" id="swapAB">swap A/B</button><button class="btn" id="mirrorSide">copy to other side</button><button class="btn" id="unskin">remove card</button></div>
      <h2>Attach points <span class="sub" style="text-transform:none;letter-spacing:0">— drag <b style="color:var(--ok)">A</b> (parent joint) and <b style="color:var(--bad)">B</b> (child joint); rings are the card's brads</span></h2>
      <canvas id="pe"></canvas>
      <div id="cardinfo"></div>
      <div class="checks" id="checks"></div>
      <h2>Library</h2>
      <div class="filters">
        <select id="fChar"><option value="">any character</option></select>
        <select id="fView"><option value="@">cards for this view</option><option value="">any view</option></select>
        <select id="fSide"><option value="">any side</option><option>L</option><option>R</option></select>
        <select id="fSort"><option value="ratio">closest length</option><option value="q">grade</option><option value="char">character</option></select>
        <label class="sub" style="grid-column:1/3"><input type="checkbox" id="fName" checked> only cards whose file name agrees with the limb (<span id="nbad"></span> filed here look mislabelled)</label>
      </div>
      <input type="search" id="fq" placeholder="label contains…">
      <div class="sub" id="ncand" style="margin:4px 0"></div>
      <div class="grid" id="cands"></div>
    </div>
  </aside>
</main>
<script src="../../nav.js" defer></script>
<script>
'use strict';
// ---------- the Bolas skeleton (26 joints, cm, y up, floor y=0) plus four points of our own ----------
const J = 'pelvis hipL hipR kneeL kneeR ankleL ankleR heelL heelR ballL ballR toeL toeR spineMid neckBase chest shoulderL shoulderR elbowL elbowR wristL wristR headBase head headTop nose'.split(' ');
const ji = Object.fromEntries(J.map((n, i) => [n, i]));
Object.assign(ji, { tipL: 26, tipR: 27, waist: 28, crotch: 29 });
const HAND_CM = 18.5;
function joints(fr, id) {
  const a = fr.a[id]; if (!a) return null;
  const j = a.j.slice();
  for (const s of ['L', 'R']) {              // fingertip: the forearm carried on by a hand length
    const e = j[ji['elbow' + s]], w = j[ji['wrist' + s]], d = v3(e, w), l = len3(d) || 1;
    j.push([w[0] + d[0] / l * HAND_CM, w[1] + d[1] / l * HAND_CM, w[2] + d[2] / l * HAND_CM]);
  }
  const p = j[0], u = v3(p, j[ji.spineMid]), l = len3(u) || 1;   // waist above the pelvis joint, crotch below: the hip bridge's span
  j.push([p[0] + u[0] / l * 7, p[1] + u[1] / l * 7, p[2] + u[2] / l * 7], [p[0] - u[0] / l * 13, p[1] - u[1] / l * 13, p[2] - u[2] / l * 13]);
  return j;
}

// ---------- segments and rig styles ----------
// a segment: the card slots it takes, the joints its A and B go to, its possible parents, which facing vector turns it,
// and (ik) the upper segment it solves with as a two-card limb
const SEG = {
  pelvis: { slots: ['pelvis'], from: 'waist', to: 'crotch', par: [], face: 'pfwd' },
  torso: { slots: ['torso'], from: 'waist', to: 'neckBase', par: ['pelvis'], face: 'fwd' },
  head: { slots: ['head'], from: 'neckBase', to: 'headTop', par: ['torso'], face: 'hfwd' },
};
for (const s of ['L', 'R']) Object.assign(SEG, {
  ['upper_arm_' + s]: { slots: ['upper_arm'], from: 'shoulder' + s, to: 'elbow' + s, par: ['torso'], face: 'fwd' },
  ['forearm_' + s]: { slots: ['forearm'], from: 'elbow' + s, to: 'wrist' + s, par: ['upper_arm_' + s], face: 'fwd', ik: 'upper_arm_' + s },
  ['mitt_' + s]: { slots: ['forearm', 'hand'], from: 'elbow' + s, to: 'tip' + s, par: ['upper_arm_' + s], face: 'fwd', ik: 'upper_arm_' + s },
  ['arm_' + s]: { slots: ['upper_arm', 'forearm'], from: 'shoulder' + s, to: 'wrist' + s, par: ['torso'], face: 'fwd' },
  ['hand_' + s]: { slots: ['hand'], from: 'wrist' + s, to: 'tip' + s, par: ['forearm_' + s, 'arm_' + s], face: 'fwd' },
  ['thigh_' + s]: { slots: ['thigh'], from: 'hip' + s, to: 'knee' + s, par: ['pelvis', 'torso'], face: 'pfwd' },
  ['shin_' + s]: { slots: ['shin'], from: 'knee' + s, to: 'ankle' + s, par: ['thigh_' + s], face: 'pfwd', ik: 'thigh_' + s },
  ['leg_' + s]: { slots: ['thigh', 'shin'], from: 'hip' + s, to: 'ankle' + s, par: ['pelvis', 'torso'], face: 'pfwd' },
  ['foot_' + s]: { slots: ['foot'], from: 'ankle' + s, to: 'toe' + s, par: ['shin_' + s, 'leg_' + s], face: 'pfwd' },
});
const LR = (...n) => n.flatMap(x => [x + '_L', x + '_R']);
const STYLES = {
  classic: { label: '14 cards', segs: ['torso', 'head', ...LR('upper_arm', 'forearm', 'hand', 'thigh', 'shin', 'foot')] },
  hips: { label: '15 · hip bridge', segs: ['pelvis', 'torso', 'head', ...LR('upper_arm', 'forearm', 'hand', 'thigh', 'shin', 'foot')] },
  mitt: { label: '13 · hip bridge + mitts', segs: ['pelvis', 'torso', 'head', ...LR('upper_arm', 'mitt', 'thigh', 'shin', 'foot')] },
  long: { label: '10 · long limbs', segs: ['torso', 'head', ...LR('arm', 'hand', 'leg', 'foot')] },
};
const VIEWS = ['side', 'front', 'back'];
const VIEWOF = v => v === 'profile' ? 'side' : v === 'front' || v === 'threequarter' ? 'front' : v === 'back' || v === 'threequarter_back' ? 'back' : null;
const OTHER = k => k.endsWith('_L') ? k.slice(0, -1) + 'R' : k.endsWith('_R') ? k.slice(0, -1) + 'L' : null;
const STICK = [['pelvis','spineMid'],['spineMid','chest'],['chest','neckBase'],['neckBase','headBase'],['headBase','headTop'],['head','nose'],
  ['neckBase','shoulderL'],['neckBase','shoulderR'],['shoulderL','elbowL'],['elbowL','wristL'],['shoulderR','elbowR'],['elbowR','wristR'],
  ['pelvis','hipL'],['pelvis','hipR'],['hipL','kneeL'],['kneeL','ankleL'],['ankleL','heelL'],['heelL','ballL'],['ballL','toeL'],['ankleL','ballL'],
  ['hipR','kneeR'],['kneeR','ankleR'],['ankleR','heelR'],['heelR','ballR'],['ballR','toeR'],['ankleR','ballR']];
// does the card's file name agree with the slot it was filed under? (the sheet labels are often wrong)
const NAME = { upper_arm: /upper|uarm|bicep|arm-a\b|^arm/, forearm: /fore|farm/, hand: /hand|palm|fist|grip|point|pinch|relax|open|thumb|wave|cup|claw/,
  thigh: /thigh/, shin: /shin|calf|leg-lower|lower-leg/, foot: /foot|shoe|boot|sneak|heel|toe/, head: /head|profile|face|front|threequarter|back/,
  torso: /torso|chest|body|jacket|shirt|vest|bodice/, pelvis: /hip|pelvis|waist/ };
const NOT = { hand: /face|head|eye|mouth/, head: /hand|arm|leg|foot/, thigh: /pelvis|connect|waist/ };
const nameOK = c => { const n = c.id.split('/').pop().toLowerCase(), sh = c.id.split('/')[0].toLowerCase(); return NAME[c.slot].test(n) && !(NOT[c.slot] && NOT[c.slot].test(sh + ' ' + n)); };

const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d'), pe = $('pe'), pctx = pe.getContext('2d');
const S = { trials: [], lib: [], trial: null, data: null, f: 0, playing: false, speed: 1, actor: null, view: 'cam', yaw: -22, elev: 7,
  sel: null, ev: 'side', skin: {}, style: 'hips', puppet: true, bindF: 0, sock: {}, isolate: true, skel: true, follow: true, ports: [], fix: {}, last: null };
const IMG = {};
const img = c => IMG[c.id] || (IMG[c.id] = Object.assign(new Image(), { src: c.img }));
const LS = { get(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } }, set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} } };
S.fix = LS.get('skinlab.fix', {});   // per card id: hand-placed A/B, and whether a profile card is drawn facing left
const AB = c => ({ A: S.fix[c.id]?.A || c.A, B: S.fix[c.id]?.B || c.B });
const pts = (c, sk) => { const p = AB(c); return sk.swap ? { A: p.B, B: p.A } : p; };
const cardLeft = c => S.fix[c.id]?.left ?? (c.slot === 'foot' ? AB(c).B[0] < AB(c).A[0] : false);

// ---------- 3D -> 2D ----------
function v3(a, b) { return [b[0] - a[0], b[1] - a[1], b[2] - a[2]]; }
function len3(a) { return Math.hypot(a[0], a[1], a[2]); }
const hyp = (p, q) => Math.hypot(q[0] - p[0], q[1] - p[1]);
const rot = (u, a) => [u[0] * Math.cos(a) - u[1] * Math.sin(a), u[0] * Math.sin(a) + u[1] * Math.cos(a)];
function makePort(x, y, w, h, yaw, elev, label) {
  const cy = Math.cos(yaw * Math.PI / 180), sy = Math.sin(yaw * Math.PI / 180), ce = Math.cos(elev * Math.PI / 180), se = Math.sin(elev * Math.PI / 180);
  const k = h / 230;                          // px per cm: a 230 cm tall window
  return { x, y, w, h, yaw, label, k, cx: 0, cz: 0, toward: [sy, 0, cy], right: [cy, 0, -sy],
    p(q) {
      const X = q[0] - this.cx, Z = q[2] - this.cz;
      const rx = X * cy - Z * sy, rz = X * sy + Z * cy;
      const ry = q[1] * ce - rz * se, d = q[1] * se + rz * ce;
      return [this.x + this.w / 2 + rx * k, this.y + this.h - 22 - ry * k, d];
    } };
}
function layout() {
  const r = cv.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  cv.width = r.width * dpr; cv.height = r.height * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = r.width, H = r.height, fy = trialFacing();
  S.ports = S.view === 'split' ? [makePort(0, 0, W / 2, H, fy + 90, 4, 'side'), makePort(W / 2, 0, W / 2, H, fy, 4, 'front')]
    : [makePort(0, 0, W, H, S.yaw, S.view === 'cam' ? S.elev : 4, S.view)];
  S.sock = {};
}
function trialFacing() { const a = S.data?.frames?.[0]?.a?.[S.actor]; return a ? Math.atan2(a.fwd[0], a.fwd[2]) * 180 / Math.PI : 0; }
function centre(port, fr) { const j = joints(fr, S.actor); if (S.follow && j) { port.cx = j[0][0]; port.cz = j[0][2]; } else { port.cx = 0; port.cz = 0; } }

// ---------- which card shows: the body's facing against the camera ----------
function active(k, sk, a, port) {
  const f = a[SEG[k].face] || a.fwd, dot = (u, v) => u[0] * v[0] + u[1] * v[1] + u[2] * v[2];
  const d = dot(f, port.toward), lat = dot(f, port.right);
  const want = d > .55 ? 'front' : d < -.55 ? 'back' : 'side';
  const order = { side: ['side', 'front', 'back'], front: ['front', 'side', 'back'], back: ['back', 'front', 'side'] }[want];
  const v = order.find(v => sk.cards[v] && S.byId[sk.cards[v]]); if (!v) return null;
  const c = S.byId[sk.cards[v]];
  // profile cards are drawn facing right unless marked: mirror across the A→B line when the body faces screen-left
  const mir = sk.mirror !== (v === 'side' && (lat < 0) !== cardLeft(c));
  return { c, view: v, want, mir };
}

// ---------- placing a card ----------
// screen = P + R(ang)·(off + s·M·R(-ax)·(q − A)), M mirrors across the card's own A→B line
function mk(k, c, sk, P, ang, s, mir) {
  const { A, B } = pts(c, sk), ax = Math.atan2(B[1] - A[1], B[0] - A[0]), lab = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1;
  return { k, c, sk, P, ang, s, mir, A, B, ax, lab, off: [sk.dx * lab * s / 100, sk.dy * lab * s / 100] };
}
function fwd(x, q) { let u = rot([q[0] - x.A[0], q[1] - x.A[1]], -x.ax); u = [u[0] * x.s + x.off[0], u[1] * x.s * (x.mir ? -1 : 1) + x.off[1]]; u = rot(u, x.ang); return [x.P[0] + u[0], x.P[1] + u[1]]; }
function inv(x, p) { let u = rot([p[0] - x.P[0], p[1] - x.P[1]], -x.ang); u = [(u[0] - x.off[0]) / x.s, (u[1] - x.off[1]) / x.s * (x.mir ? -1 : 1)]; u = rot(u, x.ax); return [u[0] + x.A[0], u[1] + x.A[1]]; }
function scaleOf(k, c, sk, j, pj, port, puppet) {
  const sg = SEG[k], { A, B } = pts(c, sk), lab = Math.hypot(B[0] - A[0], B[1] - A[1]) || 1;
  if (sk.mode === 'true') return port.k / c.px_per_cm * sk.scale;
  // fit: pinned cards stretch to the bone as seen; puppet cards stay rigid at the bone's real 3D length
  return (puppet ? len3(v3(j[ji[sg.from]], j[ji[sg.to]])) * port.k : hyp(pj[ji[sg.from]], pj[ji[sg.to]])) / lab * sk.scale;
}
// where a child hangs on its parent card: the parent's B when the child continues the chain, its A when they share a root,
// otherwise read off the parent card at the bind frame (and snapped to the nearest real brad on it)
function socket(k, px, port, puppet) {
  const sg = SEG[k], ps = SEG[px.k];
  if (ps.to === sg.from) return { p: fwd(px, px.B), how: 'chain' };
  if (ps.from === sg.from) return { p: fwd(px, px.A), how: 'root' };
  const key = [port.label, Math.round(port.yaw), px.c.id, px.sk.mode, px.sk.scale, px.sk.swap, px.mir, k, S.bindF, puppet, S.actor].join('|');
  let q = S.sock[key];
  if (!q) {
    const fr = S.data.frames[S.bindF], cx = port.cx, cz = port.cz; centre(port, fr);

  const c = editCard(); if (!c || !peXf) return;
  const r = pe.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top, { A, B } = AB(c);
  const dA = Math.hypot(x - peXf.ox - A[0] * peXf.s, y - peXf.oy - A[1] * peXf.s), dB = Math.hypot(x - peXf.ox - B[0] * peXf.s, y - peXf.oy - B[1] * peXf.s);
  peDrag = dA < dB ? 'A' : 'B'; pe.setPointerCapture(e.pointerId); move(e);
});
function move(e) {
  if (!peDrag) return;
  const c = editCard(), r = pe.getBoundingClientRect();
  let p = [(e.clientX - r.left - peXf.ox) / peXf.s, (e.clientY - r.top - peXf.oy) / peXf.s];
  for (const b of c.brads || []) if (Math.hypot(b[0] - p[0], b[1] - p[1]) * peXf.s < 10) p = b.slice();   // snap onto a brad
  const f = S.fix[c.id] ||= {}; f.A ||= c.A.slice(); f.B ||= c.B.slice();
  f[peDrag] = [Math.round(p[0] * 10) / 10, Math.round(p[1] * 10) / 10]; S.sock = {}; drawPE(); draw();
}
pe.addEventListener('pointermove', move);
pe.addEventListener('pointerup', () => { if (peDrag) { peDrag = null; LS.set('skinlab.fix', S.fix); renderCands(); renderScore(); } });

// ---------- skins: keep, save, load, export, auto-dress ----------
function keep() { LS.set('skinlab.current', { skin: S.skin, style: S.style }); }
function migrate(sk) {   // older skins held one card per limb
  for (const k in sk) { const s = sk[k]; if (s.card) { s.cards = { [VIEWOF(S.byId[s.card]?.view) || 'side']: s.card }; delete s.card; delete s.upright; } if (!s.cards) delete sk[k]; }
  return sk;
}
function refreshLoad() { $('load').innerHTML = '<option value="">load…</option>' + Object.keys(LS.get('skinlab.saved', {})).map(n => `<option>${n}</option>`).join(''); }
function setSkin(sk, style) { S.skin = migrate(JSON.parse(JSON.stringify(sk || {}))); if (style) S.style = style; $('style').value = S.style; changed(); renderBones(); renderSel(); renderCands(); draw(); renderScore(); }
$('save').onclick = () => { const n = prompt('name this skin', 'skin ' + new Date().toISOString().slice(5, 16)); if (!n) return; const s = LS.get('skinlab.saved', {}); s[n] = { skin: S.skin, style: S.style }; LS.set('skinlab.saved', s); refreshLoad(); };
$('load').onchange = e => { const s = LS.get('skinlab.saved', {})[e.target.value]; if (s) setSkin(s.skin || s, s.style); e.target.value = ''; };
$('clear').onclick = () => setSkin({});
$('export').onclick = () => {
  const out = { about: 'Skin Lab skin: per limb a card for each view (side/front/back); A at the parent joint, B at the child joint (card px)', style: S.style, trial: S.trial?.id, bind_frame: S.bindF, limbs: {} };
  for (const [k, sk] of Object.entries(S.skin)) out.limbs[k] = { ...sk, joints: [SEG[k].from, SEG[k].to], cards: Object.fromEntries(Object.entries(sk.cards).map(([v, id]) => { const c = S.byId[id]; return [v, { id, img: c.img, ...AB(c), px_per_cm: c.px_per_cm, facing_left: cardLeft(c) }]; })) };
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([JSON.stringify(out, null, 1)], { type: 'application/json' })), download: 'skin.json' }); a.click();
};
function dress(ch) {
  const fr = S.data.frames[S.f], j = joints(fr, S.actor);
  const mine = S.lib.filter(c => c.character === ch && c.q !== 'C' && nameOK(c));
  const cover = {}; for (const c of mine) (cover[c.costume] ||= new Set()).add(c.slot + VIEWOF(c.view));
  const costume = Object.keys(cover).sort((a, b) => cover[b].size - cover[a].size)[0];   // one costume, the one that covers most
  const sk = {}, home = {};
  for (const pass of [0, 1]) for (const k of Object.keys(SEG)) {
    const sg = SEG[k], side = k.endsWith('_L') ? 'L' : k.endsWith('_R') ? 'R' : null, bl = len3(v3(j[ji[sg.from]], j[ji[sg.to]])) || 1;
    for (const v of VIEWS) {
      const pool = mine.filter(c => sg.slots.includes(c.slot) && (VIEWOF(c.view) === v || (v === 'side' && !c.view)));
      if (!pool.length) continue;
      const score = c => { const { A, B } = AB(c); const r = Math.hypot(B[0] - A[0], B[1] - A[1]) / c.px_per_cm / bl;
        return Math.abs(Math.log(r)) + (c.costume === costume ? 0 : .5) + (side && c.side && c.side !== side ? .2 : 0) + (c.view ? 0 : .15)
          + (c.q === 'A' ? 0 : .15) + (/brads|eyelet|ankle|neck|waist/.test(c.pts) ? 0 : .25) + (sg.slots[0] === c.slot ? 0 : .3)
          + (pass && home[v] && c.id.split('/')[0] !== home[v] ? .35 : 0); };
      pool.sort((a, b) => score(a) - score(b));
      (sk[k] ||= newSkin()).cards[v] = pool[0].id;
    }
    // second pass: keep each view on the sheet most of its cards came from, so a figure is drawn in one hand
    if (!pass) for (const v of VIEWS) { const n = {}; for (const x of Object.values(sk)) if (x.cards[v]) { const sh = x.cards[v].split('/')[0]; n[sh] = (n[sh] || 0) + 1; }
      home[v] = Object.keys(n).sort((a, b) => n[b] - n[a])[0]; }
  }
  setSkin(sk);
}
$('dress').onchange = e => { if (e.target.value && S.data) dress(e.target.value); e.target.value = ''; };
function setStyle(st) { S.style = st; $('style').value = st; S.sock = {}; keep(); if (S.sel && !STYLES[st].segs.includes(S.sel)) select(null); renderBones(); draw(); renderScore(); }
$('style').onchange = e => setStyle(e.target.value);
$('solveB').onclick = () => { S.puppet = !S.puppet; $('solveB').classList.toggle('on', S.puppet); $('solveB').textContent = S.puppet ? 'puppet · IK' : 'pinned to skeleton'; S.sock = {}; draw(); renderScore(); };
$('bind').onclick = () => { S.bindF = S.f; S.sock = {}; $('bind').textContent = 'bound at f' + S.f; draw(); renderScore(); };

// ---------- trials ----------
function renderTrials() {
  const q = $('tq').value.toLowerCase();
  $('trials').innerHTML = S.trials.filter(t => !q || (t.id + ' ' + t.title + ' ' + t.note).toLowerCase().includes(q))
    .map(t => `<div class="trial${S.trial?.id === t.id ? ' on' : ''}" data-id="${t.id}"><b>${t.id}</b>${t.title}<small>${t.actors.join(' · ')} · ${t.len} f</small></div>`).join('');
}
$('tq').addEventListener('input', renderTrials);
$('trials').addEventListener('click', e => { const id = e.target.closest('.trial')?.dataset.id; if (id) loadTrial(id); });
async function loadTrial(id) {
  const t = S.trials.find(x => x.id === id); S.trial = t; renderTrials();
  S.data = await (await fetch(t.file)).json();
  S.f = 0; S.bindF = 0; $('bind').textContent = 'bind here'; $('scrub').max = S.data.frames.length - 1;
  const ids = (S.data.actors || []).map(a => a.id);
  $('actor').innerHTML = (S.data.actors || []).map(a => `<option value="${a.id}">${a.id} · ${a.name}</option>`).join('');
  S.actor = ids.includes(S.actor) ? S.actor : ids[0]; $('actor').value = S.actor;
  if (S.data.view?.yaw != null) { S.elev = S.data.view.elev ?? 7; if (S.view === 'cam') { S.yaw = S.data.view.yaw; $('yaw').value = S.yaw; } }
  $('note').textContent = (t.note || '') + (S.data.after ? '  — after ' + S.data.after : '');
  history.replaceState(null, '', '#' + id);
  layout(); draw(); renderCands(); renderScore();
}
$('actor').onchange = e => { S.actor = e.target.value; layout(); draw(); renderCands(); renderScore(); };

// ---------- playback & view ----------
let last = 0, acc = 0;
function tick(t) {
  if (S.playing && S.data) {
    acc += Math.min(100, t - last) * S.speed * 30 / 1000;
    if (acc >= 1) { S.f = (S.f + Math.floor(acc)) % S.data.frames.length; acc %= 1; draw(); }
  }
  last = t; requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
$('play').onclick = () => { S.playing = !S.playing; $('play').textContent = S.playing ? '❚❚' : '▶'; };
$('scrub').oninput = e => { S.f = +e.target.value; draw(); };
$('speed').onchange = e => S.speed = +e.target.value;
$('yaw').oninput = e => { S.yaw = +e.target.value; if (S.view === 'split') S.view = 'cam'; layout(); draw(); markView(); };
$('yaw').onchange = renderScore;
document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
  S.view = b.dataset.view;
  const fy = trialFacing();
  if (S.view === 'front') S.yaw = fy; else if (S.view === 'side') S.yaw = fy + 90; else if (S.view === 'cam') S.yaw = S.data?.view?.yaw ?? -22;
  S.yaw = ((S.yaw + 540) % 360) - 180; $('yaw').value = S.yaw; markView(); layout(); draw(); renderScore();
});
function markView() { document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('on', b.dataset.view === S.view)); }
for (const [id, f] of [['isolate', 'isolate'], ['bonesT', 'skel'], ['follow', 'follow']]) $(id).onclick = () => { S[f] = !S[f]; $(id).classList.toggle('on', S[f]); S.sock = {}; draw(); };
addEventListener('resize', () => { layout(); draw(); drawPE(); });
addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.target.type !== 'range') return;
  if (e.key === ' ') { e.preventDefault(); $('play').click(); }
  if (e.key === 'ArrowRight' && S.data) { S.f = (S.f + 1) % S.data.frames.length; draw(); }
  if (e.key === 'ArrowLeft' && S.data) { S.f = (S.f - 1 + S.data.frames.length) % S.data.frames.length; draw(); }
  if (e.key === 'Escape') select(null);
});

// ---------- boot ----------
(async () => {
  [S.trials, S.lib] = await Promise.all([fetch('trials.json').then(r => r.json()), fetch('library.json').then(r => r.json())]);
  S.byId = Object.fromEntries(S.lib.map(c => [c.id, c]));
  const chars = [...new Set(S.lib.map(c => c.character).filter(Boolean))].sort();
  fill($('fChar'), chars); fill($('dress'), chars);
  fill($('fView'), [...new Set(S.lib.map(c => c.view).filter(Boolean))].sort());
  $('style').innerHTML = Object.entries(STYLES).map(([k, v]) => `<option value="${k}">${v.label}</option>`).join('');
  const cur = LS.get('skinlab.current', {});
  S.skin = migrate(cur.skin || (cur.cards || cur.torso ? cur : {})); S.style = STYLES[cur.style] ? cur.style : S.style; $('style').value = S.style;
  for (const k in S.skin) for (const v in S.skin[k].cards) if (!S.byId[S.skin[k].cards[v]]) delete S.skin[k].cards[v];
  refreshLoad(); renderTrials(); renderBones(); markView();
  const want = location.hash.slice(1);
  await loadTrial(S.trials.some(t => t.id === want) ? want : S.trials[0].id);
  if (!Object.keys(S.skin).length) dress('poet');
  setInterval(() => { if (!S.playing) draw(); }, 500);   // images arrive lazily
})();
</script>
