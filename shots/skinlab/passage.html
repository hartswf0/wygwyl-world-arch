<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booth Passage</title>
<style>
:root{--bg:#0b0a09;--ink:#efe6da;--dim:#9a8d7e;--line:#2a221c;--acc:#e7a35a;--mono:ui-monospace,'JetBrains Mono',monospace}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.4 system-ui,sans-serif}
#wrap{max-width:1600px;margin:0 auto}
canvas{display:block;width:100%;height:auto;background:#000}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:6px 10px;border-top:1px solid var(--line)}
.bar input[type=range]{flex:1;min-width:140px;accent-color:var(--acc)}
.btn{font:12px var(--mono);color:var(--dim);background:none;border:1px solid var(--line);border-radius:999px;padding:3px 10px;cursor:pointer}
.btn.on{color:#1a120a;background:var(--acc);border-color:var(--acc)}
#info{font:11px var(--mono);color:var(--dim);padding:4px 10px;white-space:pre-wrap}
body.render .bar,body.render #info{display:none}
body.render{background:#000}
body.render #wrap{max-width:none}
body.render canvas{width:1600px;height:900px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="cv" width="1600" height="900"></canvas>
<div class="bar">
  <button class="btn" id="play">▶ play</button>
  <input type="range" id="scrub" min="0" max="0" value="0">
  <span id="fr" style="font:12px var(--mono);width:120px">0</span>
  <button class="btn" id="diag" title="skeleton, brads and the measured invariants over the picture">diagnostics</button>
</div>
<div id="info"></div>
</div>
<audio id="au" preload="auto"></audio>
<script src="puppet-core.js"></script>
<script>
'use strict';
/* The booth passage player. Loads library.json, a passage EDL (passages/*.json), a character contract (contracts/poet.json,
   else contracts/poet.provisional.json, else an auto-dress made here), assembles the motion from the Crash Lab bank,
   and draws the set, the puppet, the props and the light. ?f=N draws frame N only (for rendering); ?dress=poet builds the
   provisional contract (window.__contract). window.__measure() returns the measured invariants for every frame. */
const Q = new URLSearchParams(location.search);
const P = PuppetCore, S = P.S, ji = P.ji, J = P.J;
const cv = document.getElementById('cv'), g = cv.getContext('2d'), W = 1600, H = 900;
if (Q.has('f') || Q.has('render')) document.body.classList.add('render');
const json = async u => { const r = await fetch(u); if (!r.ok) throw new Error(u + ' ' + r.status); return r.json(); };
const tryJson = async u => { try { const r = await fetch(u, { cache: 'no-store' }); return r.ok ? await r.json() : null; } catch { return null; } };
const IM = {}; const loadImg = src => IM[src] || (IM[src] = Object.assign(new Image(), { src }));
const waitImg = im => new Promise(r => { if (im.complete) return r(); const t = setTimeout(() => { console.log('image slow', im.src); r(); }, 8000); im.addEventListener('load', () => { clearTimeout(t); r(); }); im.addEventListener('error', () => { clearTimeout(t); r(); }); });
const okImg = im => im && im.complete && im.naturalWidth > 0;
const lerp = (a, b, t) => a + (b - a) * t, clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const smooth = t => t * t * (3 - 2 * t);
const E = { frames: [], segs: [], shots: {}, parts: {}, ens: {}, trials: {}, K: {}, contract: null, contractFrom: '' };

// ---------- a trial's frames, mirrored, turned, retargeted and placed ----------
const MIRROR_IDX = J.map(n => { const m = n.match(/^(.*)([LR])$/); return m && J.includes(m[1] + (m[2] === 'L' ? 'R' : 'L')) ? J.indexOf(m[1] + (m[2] === 'L' ? 'R' : 'L')) : J.indexOf(n); });
const rotY = (v, deg) => { const a = deg * Math.PI / 180, c = Math.cos(a), s = Math.sin(a); return [v[0] * c + v[2] * s, v[1], -v[0] * s + v[2] * c]; };
const mirHeld = h => h ? h.replace(/(L|R)$/, m => m === 'L' ? 'R' : 'L') : h;
async function trial(id) {
  if (E.trials[id]) return E.trials[id];
  const d = P.decode(await json('bank/' + id + '.json'));
  return E.trials[id] = d;
}
function srcAt(seg, t) {   // poem time → source frame (float), piecewise linear on the map
  const m = seg.map; if (t <= m[0][0]) return m[0][1];
  for (let i = 1; i < m.length; i++) if (t <= m[i][0]) return lerp(m[i - 1][1], m[i][1], (t - m[i - 1][0]) / ((m[i][0] - m[i - 1][0]) || 1));
  return m[m.length - 1][1];
}
function rawPose(d, sf) {   // a source frame (fractional: the two neighbours mixed)
  const n = d.frames.length, f0 = clamp(Math.floor(sf), 0, n - 1), f1 = clamp(f0 + 1, 0, n - 1), u = clamp(sf - f0, 0, 1);
  const A = d.frames[f0], B = d.frames[f1], a = A.a.A, b = B.a.A;
  const mixv = (p, q) => p.map((v, i) => lerp(v, q[i], u));
  const pose = { j: a.j.map((q, i) => mixv(q, b.j[i])), fwd: mixv(a.fwd, b.fwd), hfwd: mixv(a.hfwd, b.hfwd), pfwd: mixv(a.pfwd, b.pfwd), p: {} };
  for (const [k, pa] of Object.entries(A.p || {})) { const pb = (B.p || {})[k] || pa; pose.p[k] = { ...pa, pos: mixv(pa.pos, pb.pos), rot: mixv(pa.rot, pb.rot), held: u < .5 ? pa.held : pb.held }; }
  return pose;
}
// one man in every trial: each trial's skeleton is retargeted to the same bone lengths (the contract's, in cm), so a join
// between trials recorded at different heights does not change his size
function kOf(trialId) {
  const d = E.trials[trialId]; if (!d || !E.target) return {};
  if (!d.K) { const rec = P.measure(d.frames[0].a.A.j); d.K = Object.fromEntries(Object.entries(E.target).map(([g, L]) => [g, L / rec[g]])); }
  return d.K;
}
function transform(seg, pose, T) {   // retarget → neck → mirror → turn → warp → place
  const K = kOf(seg.trial || 'T025');
  let j = Object.keys(K).length ? P.retarget(pose.j, K) : pose.j.map(q => q.slice());
  let fw = [pose.fwd, pose.hfwd, pose.pfwd], props = JSON.parse(JSON.stringify(pose.p));
  if (E.edl.neck_deg) { const c = P.clampNeck(j, fw[0], fw[1], seg.neck_deg ?? E.edl.neck_deg); j = c.j; fw[1] = c.hfwd; }
  if (seg.upright && pose.up0) {   // the trunk and head held nearer the trial's first (standing) pose: the source bows to a table we do not have
    const w = seg.upright.w, U = ['spineMid', 'chest', 'neckBase', 'shoulderL', 'shoulderR', 'headBase', 'head', 'headTop', 'nose'], free = (seg.upright.free || []).map(s => seg.mirror ? (s === 'L' ? 'R' : 'L') : s);
    const p0 = j[0], q0 = pose.up0[0], dS = {};
    for (const n of U) { const i = ji[n], t = pose.up0[i].map((v, c) => v - q0[c] + p0[c]); dS[n] = t.map((v, c) => (v - j[i][c]) * w); j[i] = j[i].map((v, c) => v + dS[n][c]); }
    for (const s of free) for (const n of ['elbow', 'wrist']) { const i = ji[n + s]; j[i] = j[i].map((v, c) => v + dS['shoulder' + s][c]); }
    fw[1] = fw[1].map((v, c) => lerp(v, pose.up0h[c], w));
  }
  if (seg.mirror) {
    j = MIRROR_IDX.map(i => [-j[i][0], j[i][1], j[i][2]]);
    fw = fw.map(v => [-v[0], v[1], v[2]]);
    for (const q of Object.values(props)) { q.pos[0] = -q.pos[0]; q.held = mirHeld(q.held); q.rot = [q.rot[0], -q.rot[1], -q.rot[2]]; }
  }
  if (seg.rot) { j = j.map(q => rotY(q, seg.rot)); fw = fw.map(v => rotY(v, seg.rot)); for (const q of Object.values(props)) { q.pos = rotY(q.pos, seg.rot); q.rot[1] += seg.rot; } }
  const lens0 = { L: armLens(j, 'L'), R: armLens(j, 'R') }, moved = new Set();
  for (const w of seg.warp || []) {
    const sf = pose.sf, [a, pk, b] = w.src, k = sf <= a || sf >= b ? 0 : sf <= pk ? smooth((sf - a) / (pk - a)) : smooth((b - sf) / (b - pk));
    for (const n of w.joints) {
      const wt = (w.weights?.[n] ?? 1);
      if (n.startsWith('prop:')) { const q = props[n.slice(5)]; if (q && !q.held) q.pos = q.pos.map((v, i) => v + w.add[i]); else if (q) q.pos = q.pos.map((v, i) => v + w.add[i] * k); continue; }
      const i = ji[n]; j[i] = j[i].map((v, c) => v + w.add[c] * k * wt); if (/^wrist/.test(n)) moved.add(n.slice(-1));
    }
  }
  for (const s of moved) fixArm(j, s, ...lens0[s], j[ji['elbow' + s]].map((v, c) => v - (c === 1 ? 25 : 0)));   // the reaching elbow hangs
  if (T) { j = j.map(q => [q[0] + T[0], q[1], q[2] + T[1]]); for (const q of Object.values(props)) q.pos = [q.pos[0] + T[0], q.pos[1], q.pos[2] + T[1]]; }
  return { j, fwd: fw[0], hfwd: fw[1], pfwd: fw[2], p: props, sf: pose.sf };
}
// a moved wrist keeps its arm: the elbow is solved again in 3D from the shoulder with the bone lengths the arm had before the
// move (so a rigid card is never shrunk or grown by a warp), bending toward the pole (the moved elbow); out of reach, the wrist is pulled in
function fixArm(j, side, L1, L2, pole) {
  const S0 = j[ji['shoulder' + side]], W0 = j[ji['wrist' + side]], d = P.v3(S0, W0), D = P.len3(d) || 1, reach = (L1 + L2) * .995;
  const Dc = Math.min(D, reach), u = d.map(v => v / D), Wt = S0.map((v, c) => v + u[c] * Dc);
  const a = (L1 * L1 + Dc * Dc - L2 * L2) / (2 * Dc), h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
  const pv = P.v3(S0, pole), pp = pv.map((v, c) => v - u[c] * (pv[0] * u[0] + pv[1] * u[1] + pv[2] * u[2])), pl = P.len3(pp) || 1;
  j[ji['wrist' + side]] = Wt; j[ji['elbow' + side]] = S0.map((v, c) => v + u[c] * a + pp[c] / pl * h);
}
const armLens = (j, s) => [P.len3(P.v3(j[ji['shoulder' + s]], j[ji['elbow' + s]])), P.len3(P.v3(j[ji['elbow' + s]], j[ji['wrist' + s]]))];
function headBasis(pose) {
  const o = pose.j[ji.head], f0 = pose.hfwd, l = Math.hypot(f0[0], f0[2]) || 1, f = [f0[0] / l, 0, f0[2] / l], s = [f[2], 0, -f[0]];
  return { o, f, s };
}
function sampleSeg(i, t) {
  const seg = E.segs[i], d = E.trials[seg.trial], sf = srcAt(seg, t);
  const pose = rawPose(d, sf); pose.sf = sf;
  if (seg.upright) { const K = kOf(seg.trial), z = rawPose(d, seg.upright.frame ?? 0), r = Object.keys(K).length ? P.retarget(z.j, K) : z.j;
    pose.up0 = r; pose.up0h = z.hfwd; }
  if (!seg.T) seg.T = [0, 0];
  const out = transform(seg, pose, seg.T);
  if (seg.hold_to_head && seg.ref) {   // keep a hand where it sits against the head in the reference pose (a handset at the ear)
    const b = headBasis(out);
    const lens = { L: armLens(out.j, 'L'), R: armLens(out.j, 'R') };
    for (const [n, loc] of Object.entries(seg.ref)) out.j[ji[n]] = [0, 1, 2].map(c => b.o[c] + b.s[c] * loc[0] + (c === 1 ? loc[1] : 0) + b.f[c] * loc[2]);
    for (const s of new Set(Object.keys(seg.ref).filter(n => /^wrist/.test(n)).map(n => n.slice(-1)))) fixArm(out.j, s, ...lens[s], out.j[ji['elbow' + s]]);
  }
  out.seg = i; return out;
}
async function assemble() {
  const edl = E.edl;
  for (const s of edl.segments) await trial(s.trial);
  E.segs = edl.segments.map(s => ({ ...s, t0: s.map[0][0], t1: s.map[s.map.length - 1][0] }));
  // reference poses for hold_to_head: the joints in the head's own frame
  for (const s of E.segs) if (s.hold_to_head?.local) s.ref = s.hold_to_head.local;   // explicit: [side (+ = his left), up, forward] cm from the head centre
  for (const s of E.segs) if (s.hold_to_head && !s.hold_to_head.local) {
    const r = s.hold_to_head.ref, d = await trial(r.trial), pose = rawPose(d, r.frame); pose.sf = r.frame;
    const tp = transform({ mirror: r.mirror, trial: r.trial }, pose, null), b = headBasis(tp);
    s.ref = Object.fromEntries(s.hold_to_head.joints.map(n => { const v = P.v3(b.o, tp.j[ji[n]]); return [n, [v[0] * b.s[0] + v[2] * b.s[2], v[1], v[0] * b.f[0] + v[2] * b.f[2]]]; }));
  }
  // placement: the first segment of a shot is placed by a joint; the rest are re-rooted on the planted foot at the join
  E.segs.forEach((s, i) => {
    if (s.place) { s.T = [0, 0]; const a = sampleSeg(i, s.t0), p = a.j[ji[s.place.joint]]; s.T = [s.place.at[0] - p[0], s.place.at[1] - p[2]]; }
    else if (s.plant) { const prev = sampleSeg(i - 1, E.segs[i - 1].t1); s.T = [0, 0]; const a = sampleSeg(i, s.t0), n = ji[s.plant];
      s.T = [prev.j[n][0] - a.j[n][0], prev.j[n][2] - a.j[n][2]]; }
  });
  const fps = edl.fps, N = Math.round((edl.t1 - edl.t0) * fps) + 1, cad = edl.cadence || 1;
  E.N = N; E.frames = [];
  let handset = 'hook', caseState = null;
  for (let f = 0; f < N; f++) {
    const fq = Math.floor(f / cad) * cad, t = edl.t0 + fq / fps;
    let i = E.segs.findIndex(s => t >= s.t0 && t < s.t1); if (i < 0) i = t < E.segs[0].t0 ? 0 : E.segs.length - 1;
    const s = E.segs[i]; let pose = sampleSeg(i, t);
    const k = Math.round((t - s.t0) * fps);
    if (s.blend && i > 0 && E.segs[i - 1].shot === s.shot && k < s.blend) {   // blend in from the previous segment's last pose (root-aligned on the planted foot)
      const prev = sampleSeg(i - 1, E.segs[i - 1].t1), w = smooth((k + 1) / (s.blend + 1));
      pose.j = pose.j.map((q, n) => q.map((v, c) => lerp(prev.j[n][c], v, w)));
      for (const key of ['fwd', 'hfwd', 'pfwd']) { const v = pose[key].map((x, c) => lerp(prev[key][c], x, w)), l = Math.hypot(...v) || 1; pose[key] = v.map(x => x / l); }
      pose.blendW = w;
      // a blend shortens the arms on the way: put each arm back at its own lengths, the elbow toward where the blend put it
      for (const sd of ['L', 'R']) fixArm(pose.j, sd, E.target.upper_arm, E.target.forearm, pose.j[ji['elbow' + sd]].map((v, c) => v - (c === 1 ? 10 : 0)));
    }
    const shot = Object.entries(E.edl.shots).find(([, v]) => t >= v.t[0] - 1e-6 && t < v.t[1] - 1e-6)?.[0] || s.shot;
    E.frames.push({ f, t, tReal: edl.t0 + f / fps, seg: i, segName: s.name, shot, sf: pose.sf, a: { A: { j: pose.j, fwd: pose.fwd, hfwd: pose.hfwd, pfwd: pose.pfwd, hands: s.hands || null } }, p: pose.p });
  }
}

// ---------- which view shows, and when it swaps ----------
// The lab picks a view per frame from the torso's facing (57° thresholds), which flickers through a turn and swaps mid-stride.
// Here a view is chosen per frame from the torso, then held: a run shorter than hold_frames joins its neighbour, a swap is moved
// (within ±3 frames, on the cadence) to a frame where both feet are down, and the EDL may declare a view from a poem time on.
// The head always shows the body's view and faces the body's way (no declared head turns in this passage).
function planViews() {
  const F = E.frames, n = F.length, hold = E.edl.hold_frames || 8, cad = E.edl.cadence || 1;
  const raw = F.map(fr => { const v = fr.a.A.fwd, d = v[2]; return d > .55 ? 'front' : d < -.55 ? 'back' : 'side'; });
  for (const dv of E.edl.views || []) for (let f = 0; f < n; f++) if (F[f].t >= dv.t[0] - 1e-6 && F[f].t < dv.t[1] - 1e-6) raw[f] = dv.view;
  const runs = () => { const r = []; for (let f = 0; f < n; f++) { const L = r[r.length - 1]; if (L && L.v === raw[f] && F[L.a].shot === F[f].shot) L.b = f; else r.push({ v: raw[f], a: f, b: f }); } return r; };
  for (let it = 0; it < 50; it++) {
    const r = runs(), short = r.map((x, i) => [x, i]).filter(([x, i]) => x.b - x.a + 1 < hold).sort((p, q) => (p[0].b - p[0].a) - (q[0].b - q[0].a))[0];
    if (!short) break;
    const [x, i] = short, prev = r[i - 1], next = r[i + 1] && F[r[i + 1].a].shot === F[x.a].shot ? r[i + 1] : null;
    const to = prev && F[prev.b].shot === F[x.a].shot ? prev.v : next ? next.v : x.v;
    for (let f = x.a; f <= x.b; f++) raw[f] = to;
  }
  const planted = f => ['L', 'R'].every(sd => Math.min(...['heel', 'ball', 'toe'].map(p => F[f].a.A.j[ji[p + sd]][1])) < 3);
  for (const x of runs().slice(1)) {
    if (F[x.a - 1]?.shot !== F[x.a].shot) continue;
    let best = x.a, bd = 99;
    for (let f = x.a - 3; f <= x.a + 3; f++) { if (f < 1 || f >= n || f % cad || F[f].shot !== F[x.a].shot) continue; const d = Math.abs(f - x.a) + (planted(f) ? 0 : 10); if (d < bd) { bd = d; best = f; } }
    if (best < x.a) for (let f = best; f < x.a; f++) raw[f] = x.v; else for (let f = x.a; f < best; f++) raw[f] = raw[x.a - 1];
  }
  E.viewRuns = runs().map(x => [x.v, x.a, x.b]);
  for (const x of runs()) {
    let lat = 0; for (let f = x.a; f <= x.b; f++) lat += F[f].a.A.fwd[0];
    for (let f = x.a; f <= x.b; f++) { F[f].a.A.views = { body: x.v, head: x.v }; F[f].a.A.lat = lat >= 0 ? 1 : -1; }
  }
}

// ---------- the world ----------
function partSrc(id) { const p = E.parts[id]; return p ? '../kits/cut/' + p.file : null; }
function camOf(shot) {
  const c = E.edl.shots[shot].cam, hz = c.foot_y - c.height * c.ppc;
  return { ...c, hz, s: z => c.ppc * c.dist / (c.dist - z), p(q) { const s = this.s(q[2]); return [W / 2 + (q[0] - c.x) * s, hz + (c.height - q[1]) * s, q[2]]; } };
}
function portFor(cam, fr) {
  const zp = fr ? fr.a.A.j[0][2] : 0;
  return { label: 'cam', yaw: 0, k: cam.s(zp), toward: [0, 0, 1], right: [1, 0, 0], cx: 0, cz: 0, p: q => cam.p(q) };
}
// a card standing on the floor: x centre, y_cm its foot above the floor, z depth (world, toward the camera)
function drawStand(id, x, y, z, w, h, cam, o = {}) {
  const im = loadImg(partSrc(id)); if (!okImg(im)) return null;
  const s = cam.s(z), hh = h || w * im.naturalHeight / im.naturalWidth, foot = cam.p([x, y, z]);
  const box = [foot[0] - w * s / 2, foot[1] - hh * s, w * s, hh * s];
  g.save(); g.globalAlpha = o.op ?? 1; if (o.blend) g.globalCompositeOperation = o.blend;
  if (o.flip) { g.translate(foot[0], 0); g.scale(-1, 1); g.translate(-foot[0], 0); }
  g.drawImage(im, ...box);
  g.restore();
  if (o.reflect) { g.save(); g.globalAlpha = o.reflect; g.translate(0, foot[1] * 2); g.scale(1, -1); g.drawImage(im, box[0], box[1], box[2], box[3]); g.restore(); }
  return box;
}
function boothLayer(name) { const l = E.ens.booth.layers.find(l => l.name === name || l.part.endsWith(name)); return l && { ...l, ...(E.edl.world.booth.override?.[l.name || name] || {}) }; }
function drawBoothCard(name, cam, o = {}) {
  const l = boothLayer(name), b = E.edl.world.booth;
  return drawStand(l.part, b.x + l.x_cm, l.y_cm, b.z - l.z_cm, l.w_cm, l.h_cm, cam, { op: l.op, reflect: l.reflect?.op ? l.reflect.op * .6 : 0, ...o });
}
function drawBack(cam) {
  const sky = E.ens.sky, hz = cam.hz, par = -(cam.x) * cam.ppc * .06;
  for (const l of sky.layers) {
    const im = loadImg(partSrc(l.part)); if (!okImg(im)) continue;
    g.save(); g.globalAlpha = l.op ?? 1; if (l.blend) g.globalCompositeOperation = l.blend;

    if (hx) { c.gripPx = handPoint(hx, .45, 0); } else c.gripPx = cam.p(c.pos);
    // where it would stand: if the hanging case reaches the floor it rests on it
    const s = camOf(fr.shot).s(c.pos[2]), floorY = cam.p([c.pos[0], 0, c.pos[2]])[1], bottom = c.gripPx[1] + E.edl.props.case.h_cm * s * (1 - E.edl.props.case.grip[1]);
    if (bottom > floorY) c.gripPx = [c.gripPx[0], c.gripPx[1] - (bottom - floorY)];
    // the world position of the case follows the drawn one, so a release drops it from where it was
    c.pos[1] = cam.height - (c.gripPx[1] + E.edl.props.case.h_cm * s * (1 - E.edl.props.case.grip[1]) - cam.hz) / s;
    c.pos[0] = cam.x + (c.gripPx[0] - W / 2) / s;
  }
  // re-run the fall from the last held position
  let last = null;
  for (let f = 0; f < E.N; f++) { const c = E.props[f].case; if (!c) continue; if (c.held) { last = c; continue; }
    if (last) { c.pos = last.pos.slice(); c.vy = 0; c.fall = true; last = null; }
    const prev = E.props[f - 1]?.case;
    if (prev && !prev.held && f > 0) { c.pos = prev.pos.slice(); c.vy = prev.vy || 0; c.fall = prev.fall; if (c.fall) { c.vy += 981 / E.edl.fps / E.edl.fps; c.pos[1] -= c.vy; if (c.pos[1] <= 0) { c.pos[1] = 0; c.fall = false; } } }
  }
}

// ---------- the character contract ----------
function applyContract(c) {
  S.style = c.style || 'hips';
  S.fix = c.fix || {};
  P.index();
  S.skin = {};
  for (const [k, l] of Object.entries(c.limbs || {})) S.skin[k] = { ...P.newSkin(), ...l, cards: { ...(l.cards || {}) } };
  const st = c.stack || {}; S.stack = Object.fromEntries(P.VIEWS.map(v => [v, st[v]?.length ? st[v].slice() : P.STACK0.slice()]));
  E.contractK = c.proportions?.K || {}; E.preset = c.proportions?.preset || 'bolas';
}
async function provisional() {
  // auto-dress the poet the way the Skin Lab's dress('poet') does: one costume, each view from the sheet most of its cards
  // came from, bone lengths read at trial T001 frame 0 (the lab's first trial), gaps kitbashed, torso and hips built by code
  const d = await trial('T001'); S.data = d; S.actor = 'A'; S.preset = 'bolas'; S.K = {}; S.fix = {};
  P.index(); P.measureActor(d.frames[0]);
  const skin = P.dress('poet', d.frames[0]);
  S.skin = skin; S.preset = 'cards'; const K = P.presetK('cards');
  const lim = {}; for (const [k, sk] of Object.entries(skin)) lim[k] = { cards: sk.cards, src: Object.fromEntries(Object.keys(sk.cards).map(v => [v, sk.src?.[v] || 'kit'])), mode: sk.mode, scale: sk.scale, rot: sk.rot, dx: sk.dx, dy: sk.dy, mirror: sk.mirror, swap: sk.swap };
  const head = skin.head?.cards?.front && S.byId[skin.head.cards.front];
  return { character: 'poet', costume: (() => { const n = {}; for (const sk of Object.values(skin)) for (const id of Object.values(sk.cards)) { const c = S.byId[id]; if (c?.character === 'poet' && c.costume) n[c.costume] = (n[c.costume] || 0) + 1; } return Object.keys(n).sort((a, b) => n[b] - n[a])[0]; })(),
    height_cm: +(P.GROUPS.includes('shin') ? (8 + ['shin', 'thigh', 'torso', 'head'].reduce((t, gk) => t + S.rec[gk] * (K[gk] ?? 1), 0)).toFixed(1) : 0),
    style: 'hips', proportions: { preset: 'cards', K }, bind_frame: 0, bind_trial: 'T001',
    stack: { side: P.STACK0.slice(), front: P.STACK0.slice(), back: P.STACK0.slice() }, limbs: lim, fix: {},
    face: { head: head?.id || null, painted: head ? !!P.painted(head) : null, features: { eye: null, brow: null, mouth: null, nose: null } },
    claims_by: 'pixels', provisional: true,
    about: 'PROVISIONAL: auto-dressed by shots/skinlab/passage.html?dress=poet the way the Skin Lab dress(\'poet\') does (style hips, preset cards). No claim here is settled by a person; contracts/poet.json (Builder A) replaces it when it exists.',
    invariants: {} };
}
// sockets are bound per view, on a neutral standing pose turned to that view (the lab binds at one frame for every view)
function bindFrames() {
  const d = E.trials.T025, base = rawPose(d, 0); base.sf = 0;
  const mk = yaw => { const p = transform({ rot: yaw, trial: 'T025' }, base, [0, 0]); return { a: { A: { j: p.j, fwd: p.fwd, hfwd: p.hfwd, pfwd: p.pfwd } } }; };
  const F = { front: mk(0), back: mk(180), right: mk(90), left: mk(-90) };
  S.bindFrame = (k, px) => {
    const v = px.view || 'side';
    if (v !== 'side') return F[v];
    // a side card: bind facing the way that gives this card its current mirror
    const c = px.c, sk = px.sk, mirLeft = sk.mirror !== (true !== P.cardLeft(c));
    return px.mir === mirLeft ? F.left : F.right;
  };
}

// ---------- boot ----------
async function boot() {
  console.log('stage', 'E.edl = await json(', performance.now()|0);
  E.edl = await json(Q.get('p') || 'passages/09-booth.json');
  const cat = await json('../kits/cut/catalog.json');
  for (const s of Object.values(cat.sheets)) for (const p of s.parts) E.parts[p.id] = p;
  const [sky, quay, booth] = await Promise.all(E.edl.world.ensembles.map(json));
  E.ens = { sky, quay, booth };
  S.lib = await json('library.json'); P.index();
  let c = null;
  if (Q.get('dress')) { c = await provisional(); E.contractFrom = 'auto-dress (this page)'; }
  else {
    c = await tryJson(E.edl.character.contract); E.contractFrom = E.edl.character.contract;
    if (!c) { c = await tryJson(E.edl.character.fallback); E.contractFrom = E.edl.character.fallback; }
    if (!c) { c = await provisional(); E.contractFrom = 'auto-dress (this page)'; }
  }
  window.__contract = c; E.contract = c;
  console.log('stage', 'applyContract(c);', performance.now()|0);
  applyContract(c);
  S.actor = 'A'; S.puppet = true;
  await trial('T025');
  // cards built by code need the skeleton's measures at the contract's proportions
  // the target bone lengths: the contract's preset read at T025 frame 0 (the passage's own trial), as the Skin Lab would
  S.preset = E.preset === 'vitruvian' ? 'vitruvian' : 'custom'; S.K = { ...E.contractK };
  P.measureActor(E.trials.T025.frames[0]);   // vitruvian: K from S.H and S.rec; custom/cards: the contract's K
  if (E.preset !== 'vitruvian') S.K = { ...E.contractK };
  E.K = { ...S.K }; E.target = Object.fromEntries(P.GROUPS.map(gk => [gk, S.rec[gk] * (E.K[gk] ?? 1)]));
  const srcs = Object.values(S.skin).flatMap(sk => [...Object.values(sk.cards), ...Object.values(sk.states || {}).flatMap(o => Object.values(o))]).map(id => S.byId[id]).filter(Boolean);
  await Promise.all(srcs.filter(c => !c.gen).map(c => waitImg(P.img(c))));
  const torsoSrc = S.lib.filter(c => c.character === c.character && !c.gen && (c.slot === 'torso' || c.slot === 'pelvis') && c.character === 'poet').slice(0, 40);
  await Promise.all(torsoSrc.map(c => waitImg(P.img(c))));
  for (const id of Object.keys(S.byId)) if (id.startsWith('gen.')) delete S.byId[id];
  S.lib = S.lib.filter(c => !c.gen);
  P.rebuildGen(S.skin);
  S.K = {};   // the assembled frames are retargeted already
  S.pv++;
  console.log('stage', 'bindFrames();', performance.now()|0);
  bindFrames();
  console.log('stage', 'await assemble();', performance.now()|0);
  await assemble();
  console.log('stage', 'propTracks();', performance.now()|0);
  planViews();
  propTracks();
  // every image the passage draws
  const ids = new Set([...E.ens.sky.layers, ...E.ens.quay.layers, ...E.ens.booth.layers, ...E.edl.world.extra].map(l => l.part));
  for (const p of Object.values(E.edl.props)) if (p.part) ids.add(p.part);
  await Promise.all([...ids].map(id => waitImg(loadImg(partSrc(id)))));
  console.log('stage', 'await placeHook();', performance.now()|0);
  await placeHook();
  console.log('stage', 'caseGrips();', performance.now()|0);
  caseGrips();
  document.getElementById('scrub').max = E.N - 1;
  const au = document.getElementById('au'); au.src = E.edl.audio;
  window.__ready = true; window.__N = E.N; window.__E = E;
  const f0 = Q.has('f') ? +Q.get('f') : 0; ST.f = f0; render(f0);
  info();
}
function info() {
  const c = E.contract;
  document.getElementById('info').textContent = `${E.edl.id} v${E.edl.version} · ${E.N} frames at ${E.edl.fps} fps · contract ${E.contractFrom}${c.provisional ? ' (provisional)' : ''} · head ${c.face?.head}\n`
    + E.segs.map(s => `${s.name}: ${s.trial} ${s.mirror ? 'mirrored ' : ''}rot ${s.rot} · ${s.t0}–${s.t1} s · src ${s.map[0][1]}–${s.map[s.map.length - 1][1]}`).join('\n');
}
window.__render = f => { ST.f = f; render(f); return true; };
// playback: the audio is the clock
const au = document.getElementById('au');
function tick() {
  if (ST.playing) { const t = au.currentTime; if (t >= E.edl.t1 || au.ended) { ST.playing = false; au.pause(); document.getElementById('play').textContent = '▶ play'; }
    const f = clamp(Math.round((t - E.edl.t0) * E.edl.fps), 0, E.N - 1); if (f !== ST.f) { ST.f = f; render(f); document.getElementById('scrub').value = f; } }
  requestAnimationFrame(tick);
}
document.getElementById('play').onclick = () => {
  ST.playing = !ST.playing; document.getElementById('play').textContent = ST.playing ? '❚❚ pause' : '▶ play';
  if (ST.playing) { au.currentTime = E.edl.t0 + ST.f / E.edl.fps; au.play(); } else au.pause();
};
document.getElementById('scrub').oninput = e => { ST.f = +e.target.value; render(ST.f); };
document.getElementById('diag').onclick = e => { ST.diag = !ST.diag; e.target.classList.toggle('on', ST.diag); render(ST.f); };
addEventListener('keydown', e => { if (e.key === 'ArrowRight') { ST.f = Math.min(E.N - 1, ST.f + 1); render(ST.f); } if (e.key === 'ArrowLeft') { ST.f = Math.max(0, ST.f - 1); render(ST.f); } if (e.key === ' ') { e.preventDefault(); document.getElementById('play').click(); } });
boot().catch(e => { console.error(e); window.__error = String(e.stack || e); document.getElementById('info').textContent = 'error: ' + e.message; });
requestAnimationFrame(tick);
</script>
