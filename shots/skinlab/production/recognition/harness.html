<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recognition harness</title>
<style>:root{--bg:#efe7d8;--ink:#2a221c}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16120f;--ink:#efe6da}}:root[data-theme="dark"]{--bg:#16120f;--ink:#efe6da}body{background:var(--bg);color:var(--ink);font:13px system-ui;margin:16px}</style>
<script src="../../puppet-core.js"></script>
<script src="../../../rig/pose-core.js"></script>
</head><body>
<p>Headless page for recognize.mjs: it poses a character contract into the Pose Lab's solves of the painted poses through PuppetCore.renderPose. Nothing to see here by hand.</p>
<script>
'use strict';
// The harness's only jobs: Pose Lab solve -> joints + a port that projects exactly like the Pose Lab (the painting's own floor,
// centre and px/cm); the painting's set piece (flat); the leave-one-family-out filter on harvested cards; framing the whole
// puppet. All mechanics are PuppetCore.renderPose's (Builder B).
const P = PuppetCore, PC = PoseCore;
let LIB = null, HV = null;
const NAMES = { pelvis: 'pelvis', hipL: 'hipL', hipR: 'hipR', knL: 'kneeL', knR: 'kneeR', anL: 'ankleL', anR: 'ankleR', heelL: 'heelL', heelR: 'heelR',
  ballL: 'ballL', ballR: 'ballR', toeL: 'toeL', toeR: 'toeR', waist: 'spineMid', neck: 'neckBase', chest: 'chest', shL: 'shoulderL', shR: 'shoulderR',
  elL: 'elbowL', elR: 'elbowR', wrL: 'wristL', wrR: 'wristR', headC: 'head', top: 'headTop', tipL: 'tipL', tipR: 'tipR' };
const W3 = p => [p[0], -p[1], p[2]];                        // Pose Lab body frame (Y down) -> renderPose (y up)
// leave-one-FAMILY-out: a painting, its numbered twins ('x-1', 'x-2') and, on the same sheet, the paintings sharing its beat code
// ('04-2-kneel-hollow' and '04-2-heart-seated'; 'q3-...') are one family; a pose never uses a card harvested from its own family
const family = id => { const [sheet, pose] = id.split('/'); const m = pose.match(/^([a-z]?\d+(?:-\d+)?)-/); return sheet + '/' + (m ? m[1] : pose.replace(/-\d+$/, '')); };
function joints(D, sol) {
  const x = PC.PN.map(n => sol.params[n] ?? 0), J = PC.fk(D.skeleton, x), o = {};
  for (const [a, b] of Object.entries(NAMES)) if (J[a]) o[b] = W3(J[a]);
  o.headBase = W3(J.neck.map((v, i) => v + (J.headC[i] - v) * .25));
  const R = J._F.Rh, f = [R[2], R[5], R[8]];                  // pose-core matrices are flat, row-major: the head's forward is column 2
  o.nose = W3(J.headC.map((v, i) => v + f[i] * 10));
  // the Skin Lab hangs its torso card from a waist 7 cm above its pelvis joint; the Pose Lab waist is the jacket hem, 19.4 cm above
  // the hip line (measured from this costume's cards): the pelvis joint goes 7 cm under the Pose Lab waist, so the torso card spans
  // the painted hem -> neck; the thighs still hang from the true hip joints
  const u = J.waist.map((v, i) => v - J.pelvis[i]), lu = Math.hypot(...u) || 1;
  o.pelvis = W3(J.waist.map((v, i) => v - u[i] / lu * 7));
  return o;
}
// the Pose Lab's projection (with its small oblique offset), mapped into a frame canvas: painting px * kU + (offX, offY)
function makePort(t, sol, kU, offX, offY, label) {
  const psi = sol.psi, s = sol.scale_px_per_cm, ox = sol.params.ox || 0, oy = sol.params.oy || 0, c = Math.cos(psi * Math.PI / 180), sn = Math.sin(psi * Math.PI / 180);
  return { label, yaw: -psi, k: s * kU, cx: 0, cz: 0, toward: [-sn, 0, c], right: [c, 0, sn],
    p(q) { const r = PC.project([q[0], -q[1], q[2]], psi, ox, oy); return [(r[0] * s + t.cx) * kU + offX, (r[1] * s + t.floor) * kU + offY, r[2]]; } };
}
const loadImg = src => new Promise(r => { const im = new Image(); im.onload = () => r(im); im.onerror = () => r(null); im.src = src; });
async function setPiece(ctx, set, kU, offX, offY) {   // the painting's prop as a flat card: its silhouette in grey kraft, edged
  const im = await loadImg('/shots/skinlab/' + set.img); if (!im) return false;
  const w = Math.round(set.w * kU), h = Math.round(set.h * kU), o = document.createElement('canvas'); o.width = w + 8; o.height = h + 8; const g = o.getContext('2d');
  g.drawImage(im, 4, 4, w, h); g.globalCompositeOperation = 'source-in'; g.fillStyle = '#c9a26b'; g.fillRect(0, 0, o.width, o.height);
  const o2 = document.createElement('canvas'); o2.width = o.width; o2.height = o.height; const g2 = o2.getContext('2d');
  for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2]]) g2.drawImage(o, dx, dy);   // a kraft edge
  const o3 = document.createElement('canvas'); o3.width = o.width; o3.height = o.height; const g3 = o3.getContext('2d');
  g3.drawImage(im, 4, 4, w, h); g3.globalCompositeOperation = 'source-in'; g3.fillStyle = '#6f665c'; g3.fillRect(0, 0, o.width, o.height);
  g2.drawImage(o3, 0, 0);
  ctx.drawImage(o2, set.x0 * kU + offX - 4, set.y0 * kU + offY - 4); return true;
}
function bboxOf(cv) {
  const g = cv.getContext('2d'), d = g.getImageData(0, 0, cv.width, cv.height).data; let x0 = cv.width, y0 = cv.height, x1 = -1, y1 = -1;
  for (let y = 0; y < cv.height; y += 2) for (let x = 0; x < cv.width; x += 2) if (d[(y * cv.width + x) * 4 + 3] > 40) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
  return x1 < 0 ? null : [x0, y0, x1, y1];
}
async function run(ch, file, U, opts) {
  if (!LIB) LIB = await (await fetch('/shots/skinlab/library.json')).json();
  const C = await (await fetch(`/shots/skinlab/contracts/${ch}.json`, { cache: 'no-store' })).json();
  const D = await (await fetch(`/shots/rig/poses/${file}.json`, { cache: 'no-store' })).json();
  if (opts.harvest && !HV) { try { HV = await (await fetch('/shots/skinlab/library_harvest.json', { cache: 'no-store' })).json(); } catch { HV = { cards: [], sets: [] }; } }
  const harvest = opts.harvest ? HV.cards.filter(c => !c.bad && c.character === ch) : null;
  await P.prepare({ contract: C, library: LIB, imgBase: '/shots/skinlab/', harvest: harvest || undefined });
  const sets = Object.fromEntries((opts.props && HV ? HV.sets : []).map(s => [s.source, s]));
  const out = [];
  for (const t of D.targets) {
    const safe = t.id.replace(/\//g, '__');
    const base = { id: t.id, safe, file, sheet: t.sheet, img: t.img, w: t.w, h: t.h, label: t.label };
    const sol = (t.solves || [])[0];
    if (!sol) { out.push({ ...base, error: 'the Pose Lab has no solve for this painting' }); continue; }
    try {
      // a big frame: the painting at kU px per painting px, placed with room on every side; cropped later to puppet + painting + set
      const kU = U / t.h, FW = Math.round(Math.max(t.w, t.h) * kU * 2.6), FH = Math.round(U * 2.2), offX = Math.round((FW - t.w * kU) / 2), offY = Math.round(.6 * U);
      const port = makePort(t, sol, kU, offX, offY, 'pose|' + t.id);
      const cv = document.createElement('canvas'); cv.width = FW; cv.height = FH; const ctx = cv.getContext('2d');
      const set = sets[t.id]; let setDrawn = false; if (set) setDrawn = await setPiece(ctx, set, kU, offX, offY);
      const H = harvest && harvest.filter(c => family(c.source) !== family(t.id));   // leave one painted pose (and its twin) out
      const r = P.renderPose(ctx, { contract: C, joints3d: joints(D, sol), port, psi: sol.psi, ground: false, handStates: {}, harvest: H || undefined, harvestExclude: t.id });
      const bb = bboxOf(cv), pb = [offX, offY, offX + t.w * kU, offY + t.h * kU];
      const u = bb ? [Math.min(bb[0], pb[0]), Math.min(bb[1], pb[1]), Math.max(bb[2], pb[2]), Math.max(bb[3], pb[3])] : pb;
      const m = Math.round(.05 * (u[3] - u[1])), crop = [Math.max(0, u[0] - m), Math.max(0, u[1] - m), Math.min(FW, u[2] + m), Math.min(FH, u[3] + m)];
      const o = document.createElement('canvas'); o.width = crop[2] - crop[0]; o.height = crop[3] - crop[1]; o.getContext('2d').drawImage(cv, -crop[0], -crop[1]);
      const sh = s => ({ ...s, P: [s.P[0] - crop[0], s.P[1] - crop[1]], Q: [s.Q[0] - crop[0], s.Q[1] - crop[1]], end: [s.end[0] - crop[0], s.end[1] - crop[1]] });
      const psi = sol.psi;
      out.push({ ...base, view: PC.viewKey(psi), psi, facing: psi % 180 === 0 ? (Math.abs(psi) === 180 ? 'away' : 'camera') : ((psi % 360) + 360) % 360 < 180 ? 'right' : 'left',
        solve_iou: sol.iou, solve_err_cm: sol.mean_err_cm, via: 'PuppetCore.renderPose', set: setDrawn ? set.img : null,
        frame: { kU, paintX: offX - crop[0], paintY: offY - crop[1], w: o.width, h: o.height }, puppet_bbox: bb && [bb[0] - crop[0], bb[1] - crop[1], bb[2] - crop[0], bb[3] - crop[1]],
        segments: (r.segments || []).map(sh), cards: r.cards, warnings: r.warnings, png: o.toDataURL('image/png') });
    } catch (e) { out.push({ ...base, error: 'render failed: ' + e.message }); }
  }
  return out;
}
window.harness = { run, api: () => P.renderPose ? 'PuppetCore.renderPose' : 'none' };
</script>
</body></html>
