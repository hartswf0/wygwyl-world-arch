<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recognition harness</title>
<style>:root{--bg:#efe7d8;--ink:#2a221c}@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#16120f;--ink:#efe6da}}:root[data-theme="dark"]{--bg:#16120f;--ink:#efe6da}body{background:var(--bg);color:var(--ink);font:13px system-ui;margin:16px}</style>
<script src="../../puppet-core.js"></script>
<script src="../../../rig/pose-core.js"></script>
</head><body>
<p>Headless page for recognize.mjs: it poses a character contract into the Pose Lab's solves of the painted poses through PuppetCore. Nothing to see here by hand.</p>
<script>
'use strict';
// The harness's only job: Pose Lab solve -> 26 Skin Lab joints + a port projecting exactly like the Pose Lab, then
// PuppetCore draws. PuppetCore.renderPose (Builder B's API) is used when present; else a thin stub over solve()/drawCard().
const P = PuppetCore, PC = PoseCore;
P.imgBase = '/shots/skinlab/';
let LIB = null;
const BOLAS = 'pelvis hipL hipR kneeL kneeR ankleL ankleR heelL heelR ballL ballR toeL toeR spineMid neckBase chest shoulderL shoulderR elbowL elbowR wristL wristR headBase head headTop nose'.split(' ');
const FROM = { pelvis: 'pelvis', hipL: 'hipL', hipR: 'hipR', kneeL: 'knL', kneeR: 'knR', ankleL: 'anL', ankleR: 'anR', heelL: 'heelL', heelR: 'heelR',
  ballL: 'ballL', ballR: 'ballR', toeL: 'toeL', toeR: 'toeR', spineMid: 'waist', neckBase: 'neck', chest: 'chest', shoulderL: 'shL', shoulderR: 'shR',
  elbowL: 'elL', elbowR: 'elR', wristL: 'wrL', wristR: 'wrR', head: 'headC', headTop: 'top' };
const W3 = p => [p[0], -p[1], p[2]];                         // Pose Lab body frame (Y down) -> Skin Lab world (y up)
const zcol = R => { const v = [R[2], R[5], R[8]], l = Math.hypot(...v) || 1; return W3(v.map(a => a / l)); };
const lerp = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const len3 = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]);
// the joint atlas: projected / 3D length of a segment in this view -> what a cut-out must do there
const verdict = (r, k) => /^foot/.test(k) ? (r >= .88 ? 'ROTATE' : 'DEDICATED-CARD') : r >= .88 ? 'ROTATE' : r >= .55 ? 'SHORTEN12+OVERLAP' : 'NEEDS-FORESHORTENED-CARD';

function setup(C) {
  P.S.lib = LIB; P.S.fix = C.fix || {}; P.index();
  P.S.skin = Object.fromEntries(Object.entries(C.limbs).map(([k, l]) => [k, { cards: { ...l.cards }, src: l.src, mode: l.mode || 'fit', scale: l.scale ?? 1, rot: l.rot || 0, dx: l.dx || 0, dy: l.dy || 0, mirror: !!l.mirror, swap: !!l.swap }]));
  P.S.style = C.style || 'hips'; P.S.stack = C.stack; P.S.K = {}; P.S.preset = 'bolas'; P.S.puppet = true; P.S.farShade = C.far_shade ?? .7;
  P.S.centre = () => {};                                    // the port already carries the painting's own placement
  P.rebuildGen(P.S.skin);
}
async function preload() {
  const ids = new Set(); for (const sk of Object.values(P.S.skin)) for (const id of Object.values(sk.cards)) ids.add(id);
  await Promise.all([...ids].map(id => { const c = P.S.byId[id]; if (!c) return 0; const im = P.img(c);
    return im.complete && im.naturalWidth ? 0 : new Promise(r => { im.onload = im.onerror = r; setTimeout(r, 4000); }); }));
}
function joints(D, sol) {
  const x = PC.PN.map(n => sol.params[n] ?? 0), J = PC.fk(D.skeleton, x), F = J._F;
  const j = BOLAS.map(n => FROM[n] ? W3(J[FROM[n]]) : null);
  j[BOLAS.indexOf('headBase')] = W3(lerp(J.neck, J.headC, .25));
  // the Skin Lab adds its waist 7 cm above its pelvis joint along the spine and hangs the torso card waist -> neck. The Pose
  // Lab's waist is the jacket hem, 19.4 cm above the hip line (measured from this costume's cards), so the Skin Lab pelvis
  // joint is put 7 cm below the Pose Lab waist: the torso card then spans the painted waist -> neck; the thighs still hang
  // from the true hip joints (their sockets bind at the hips' own positions).
  const u = J.waist.map((v, i) => v - J.pelvis[i]), lu = Math.hypot(...u) || 1;
  j[0] = W3(J.waist.map((v, i) => v - u[i] / lu * 7));
  const hf = zcol(F.Rh); j[BOLAS.indexOf('nose')] = W3(J.headC).map((v, i) => v + hf[i] * 10);
  return { j, fwd: zcol(F.Rt), hfwd: hf, pfwd: zcol(F.R0) };
}
function makePort(t, sol, U, label) {
  const psi = sol.psi, s = sol.scale_px_per_cm, k = U / t.h, Wc = Math.max(t.w, .75 * t.h), dx = (Wc - t.w) / 2 * k;
  const ox = sol.params.ox || 0, oy = sol.params.oy || 0, c = Math.cos(psi * Math.PI / 180), sn = Math.sin(psi * Math.PI / 180);
  return { label, yaw: psi, k: s * k, cx: 0, cz: 0, x: 0, y: 0, w: Math.round(Wc * k), h: U, toward: [-sn, 0, c], right: [c, 0, sn], dx,
    p(q) { const r = PC.project([q[0], -q[1], q[2]], psi, ox, oy); return [(r[0] * s + t.cx) * k + dx, (r[1] * s + t.floor) * k, r[2]]; } };
}
function draw(ctx, C, frame, port, t, sol) {
  const view = PC.viewKey(sol.psi), facing = ((sol.psi % 360) + 360) % 360 < 180 && sol.psi % 180 ? 'right' : sol.psi % 180 ? 'left' : 'none';
  if (P.renderPose) {                                        // Builder B's general API
    const r = P.renderPose(ctx, { contract: C, library: LIB, joints3d: frame.a.A, view, facing, heightPx: (D_H * port.k), x: port.p(frame.a.A.j[0])[0], y: port.p([0, 0, 0])[1], handStates: {}, port });
    return { via: 'PuppetCore.renderPose', sol: r && r.sol, segments: r && r.segments };
  }
  P.S.data = { frames: [frame], n: 1 }; P.S.actor = 'A'; P.S.bindF = 0; P.S.sock = {}; P.S.pv++; P.measureActor(); P.S.K = {};
  const sl = P.solve(frame, port, P.S.style, true);
  if (sl) for (const x of sl.order) P.drawCard(ctx, x, 1);
  return { via: 'stub: PuppetCore.solve + drawCard (puppet IK, rigid cards pinned at brads)', sol: sl };
}
let D_H = 180;
async function run(ch, file, U) {
  if (!LIB) LIB = await (await fetch('/shots/skinlab/library.json')).json();
  const C = await (await fetch(`/shots/skinlab/contracts/${ch}.json`, { cache: 'no-store' })).json();
  const D = await (await fetch(`/shots/rig/poses/${file}.json`, { cache: 'no-store' })).json();
  D_H = D.skeleton.standing_cm || D.skeleton.H || 180;
  setup(C); await preload();
  const out = [];
  for (const t of D.targets) {
    const safe = t.id.replace(/\//g, '__');
    const base = { id: t.id, safe, file, sheet: t.sheet, img: t.img, w: t.w, h: t.h, label: t.label };
    const sol = (t.solves || [])[0];
    if (!sol) { out.push({ ...base, error: 'the Pose Lab has no solve for this painting' }); continue; }
    try {
      const frame = { a: { A: joints(D, sol) } }, port = makePort(t, sol, U, t.id);
      const cv = document.createElement('canvas'); cv.width = port.w; cv.height = U; const ctx = cv.getContext('2d');
      const r = draw(ctx, C, frame, port, t, sol);
      const jj = P.joints(frame, 'A'), pj = jj.map(q => port.p(q));
      const segments = r.segments || (r.sol ? r.sol.order.map(x => {
        const sg = P.SEG[x.k], a = P.ji[sg.from], b = P.ji[sg.to], L3 = len3(jj[a], jj[b]), L2 = Math.hypot(pj[b][0] - pj[a][0], pj[b][1] - pj[a][1]) / port.k, ratio = L3 ? L2 / L3 : 1;
        const e = P.fwd(x, x.B);
        return { k: x.k, role: x.role, card: x.c.id, view: x.view, want: x.want, mirrored: !!x.mir, miss_cm: +x.miss.toFixed(1), ratio: +ratio.toFixed(3), atlas: verdict(ratio, x.k),
          drawn: 'rigid card, rotated in plane (puppet IK)', P: [Math.round(x.P[0]), Math.round(x.P[1])], Q: [Math.round(pj[b][0]), Math.round(pj[b][1])], end: [Math.round(e[0]), Math.round(e[1])] };
      }) : []);
      const psi = sol.psi;
      out.push({ ...base, view: PC.viewKey(psi), psi, facing: psi % 180 === 0 ? (Math.abs(psi) === 180 ? 'away' : 'camera') : ((psi % 360) + 360) % 360 < 180 ? 'right' : 'left',
        solve_iou: sol.iou, solve_err_cm: sol.mean_err_cm, via: r.via, canvasW: port.w, dx: port.dx, segments, png: cv.toDataURL('image/png') });
    } catch (e) { out.push({ ...base, error: 'render failed: ' + e.message }); }
  }
  return out;
}
window.harness = { run, api: () => P.renderPose ? 'PuppetCore.renderPose' : 'stub over PuppetCore.solve/drawCard (renderPose not published yet)' };
</script>
</body></html>
