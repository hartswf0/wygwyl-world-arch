<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Booth Run</title>
<style>
:root{--bg:#0d0b0a;--ink:#efe6da;--dim:#9a8d7e;--line:#2a221c;--ok:#8fd16a;--warn:#e7c35a;--bad:#ef6a5a;--acc:#e7a35a}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0 2px}h2{font-size:14px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin:22px 0 8px}
.card{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
video,img{width:100%;border-radius:8px;display:block;background:#000}
.v{display:inline-block;font:12px ui-monospace,monospace;padding:1px 8px;border-radius:9px}
.met{background:#8fd16a33;color:var(--ok)}.stronger{background:#ef6a5a33;color:var(--bad)}.inconclusive{background:#e7c35a33;color:var(--warn)}.running{background:#5fd0ff33;color:#5fd0ff}
small{color:var(--dim)}a{color:var(--acc)}
</style></head><body><main>
<h1 id="t">Booth run</h1><div id="s" style="color:var(--dim)"></div>
<div id="media"></div>
<h2>rounds</h2><div id="rounds"></div>
<h2>checkpoints</h2><div id="cp"></div>
</main>
<script>
fetch('progress.json?'+Date.now()).then(r=>r.json()).then(P=>{
  document.getElementById('t').textContent=P.run;
  document.getElementById('s').innerHTML=`status: <b>${P.status}</b> · bar: <a href="${P.bar}">${P.bar}</a>`;
  if(P.latest) document.getElementById('media').innerHTML=`<div class="card"><video controls playsinline src="${P.latest.mp4}"></video><small>${P.latest.label||''}</small></div>`+(P.latest.strip?`<div class="card"><img src="${P.latest.strip}" alt="contact strip"></div>`:'');
  document.getElementById('rounds').innerHTML=P.rounds.slice().reverse().map(r=>`<div class="card"><b>round ${r.n}</b> — ${r.what}<ul>${(r.tasks||[]).map(t=>`<li><span class="v ${t.state==='running'?'running':''}">${t.state}</span> ${t.who}: ${t.what}${t.out?` — <a href="${t.out}">open</a>`:''}</li>`).join('')}</ul>${(r.verdicts||[]).map(v=>`<div><span class="v ${v.verdict}">${v.verdict}</span> <b>${v.on}</b>: ${v.gap}<br><small>${v.evidence||''}</small></div>`).join('')}</div>`).join('');
  document.getElementById('cp').innerHTML=(P.checkpoints||[]).map(c=>`<div class="card">${c.commit} — ${c.what}</div>`).join('')||'<small>none yet</small>';
});
</script></body></html>
